document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yebrow, ls 2.5px, uppercase, 600 */\n--fs-small:13px;\n--fs-tiny:12px;\n}\n<\u002Fstyle>\n<style>/* ILACH color tokens — verbatim from site :root */\n:root{\n/* green ramp (brand) */\n--g900:#061810;--g800:#0d2b1c;--g700:#153d28;--g600:#1e5537;\n--g500:#2a7a4f;--g400:#3ea86e;--g300:#6dc496;--g200:#a8dfc0;\n--g100:#d6f0e3;--g50:#eef8f3;\n/* text */\n--text:#0d1f16;--text2:#2e4d3a;--text3:#5a7a66;\n/* surfaces */\n--border:#ddeee5;--surface:#f5fbf7;--white:#ffffff;\n/* semantic accents (analytics) */\n--red:#e53e3e;--red-bg:rgba(229,62,62,0.08);--red-border:rgba(229,62,62,0.2);\n--orange:#dd6b20;--orange-bg:rgba(221,107,32,0.08);--orange-border:rgba(221,107,32,0.2);\n--blue:#3182ce;--blue-bg:rgba(49,130,206,0.08);--blue-border:rgba(49,130,206,0.2);\n--gold:#d4a017;--gold-bg:rgba(212,160,23,0.1);--gold-border:rgba(212,160,23,0.25);\n/* dark-section aliases (on --g900) */\n--dark-card-bg:rgba(255,255,255,0.04);--dark-card-border:rgba(255,255,255,0.08);\n--dark-card-hover-border:rgba(62,168,110,0.3);\n--dark-text-hi:rgba(255,255,255,0.75);--dark-text-mid:rgba(255,255,255,0.5);--dark-text-lo:rgba(255,255,255,0.35);\n--brand-pill-bg:rgba(62,168,110,0.1);--brand-pill-border:rgba(62,168,110,0.2);\n/* semantic aliases */\n--action:var(--g500);--action-hover:var(--g400);\n--accent-on-dark:var(--g400);--accent-text-on-dark:var(--g300);\n--heading-accent:var(--g500);\n}\n<\u002Fstyle>\n<style>\n  doc-page:not(:defined){visibility:hidden}\n  .doc-body p{orphans:3;widows:3;margin:0 0 8px;font-size:12px;line-height:1.6;color:var(--text2)}\n  .doc-body li{orphans:3;widows:3;font-size:12px;line-height:1.5;color:var(--text2);margin:0 0 4px}\n  .doc-body ul{margin:0 0 10px;padding-left:18px}\n  .doc-body strong{color:var(--g900);font-weight:600}\n  .ch{break-before:page}\n  .keep,.tbl,.callout,.stat-row,.fig,.qa{break-inside:avoid}\n  tr,thead,figure{break-inside:avoid}\n  table{width:100%;border-collapse:collapse}\n  .th{background:var(--g800);color:#fff;text-align:left;padding:7px 10px;font-weight:600;font-size:9.5px;letter-spacing:0.2px;vertical-align:top;line-height:1.35}\n  .td{padding:6px 10px;border-bottom:1px solid var(--border);color:var(--text2);font-size:10.5px;vertical-align:top;line-height:1.45}\n  .td b{color:var(--text);font-weight:600}\n  .cap{font-size:11px;font-weight:600;color:var(--g700);margin:0 0 5px}\n  .src{font-size:9.5px;color:var(--text3);font-style:italic;line-height:1.4;margin:5px 0 0}\n  .zeb:nth-child(even){background:var(--surface)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"doc-page\" from=\"d7056526-6d6c-47ca-b41c-ef05fefd1b00#/doc-page.js\" size=\"a4\" margin=\"15mm\" hint-size=\"100%,100%\">\n\n<div slot=\"header\" style=\"display:flex;align-items:center;justify-content:space-between;font-family:var(--font-body);font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);padding-bottom:5px;border-bottom:1px solid var(--border)\">\n  <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"display:inline-flex;width:14px;height:14px;background:var(--g500);border-radius:4px;color:#fff;font-family:var(--font-head);font-weight:700;align-items:center;justify-content:center;font-size:9px\">İ<\u002Fspan> I-LACH · Аналитическая серия<\u002Fspan>\n  <span>Документ 3.1 — Терлипрессин<\u002Fspan>\n<\u002Fdiv>\n<div slot=\"footer\" style=\"display:flex;align-items:center;justify-content:space-between;font-family:var(--font-body);font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);padding-top:5px;border-top:1px solid var(--border)\">\n  <span>Конфиденциально — для инвестиционного комитета<\u002Fspan>\n  <span>июль 2026<\u002Fspan>\n<\u002Fdiv>\n\n<div class=\"doc-body\" style=\"font-family:var(--font-body)\">\n\n<!-- ================= COVER ================= -->\n<div class=\"keep\" style=\"min-height:242mm;display:flex;flex-direction:column\">\n  <div style=\"display:flex;align-items:center;gap:11px\">\n    <span style=\"display:inline-flex;width:34px;height:34px;background:var(--g500);border-radius:8px;color:#fff;font-family:var(--font-head);font-weight:700;align-items:center;justify-content:center;font-size:22px\">İ<\u002Fspan>\n    <span style=\"font-family:var(--font-head);font-weight:600;font-size:20px;letter-spacing:1.5px;color:var(--g900)\">ILACH<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"margin-top:24px\"><span style=\"display:inline-block;background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);font-size:9.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;padding:5px 11px;border-radius:6px\">Конфиденциально — для инвестиционного комитета<\u002Fspan><\u002Fdiv>\n  <div style=\"margin-top:40px;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--g500);font-weight:600;line-height:1.6\">Серия аналитических отчётов по проекту I-LACH<br>Документ 3.1 · Детальный анализ молекулы (1 из 5)<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:62px;letter-spacing:-2px;color:var(--g900);margin:14px 0 0;line-height:1.02\">Терлипрессин<\u002Fh1>\n  <div style=\"margin-top:14px;font-size:16px;color:var(--text2);line-height:1.5;max-width:80%\">Анализ молекулы через данные госзакупок, ГРЛС и мирового рынка<\u002Fdiv>\n  <div style=\"margin-top:18px;display:flex;flex-wrap:wrap;gap:7px\">\n    <span style=\"font-size:10.5px;color:var(--g700);background:var(--g50);border:1px solid var(--g100);border-radius:100px;padding:5px 12px\">АТХ H01BA04<\u002Fspan>\n    <span style=\"font-size:10.5px;color:var(--g700);background:var(--g50);border:1px solid var(--g100);border-radius:100px;padding:5px 12px\">Синтетический аналог вазопрессина<\u002Fspan>\n    <span style=\"font-size:10.5px;color:var(--g700);background:var(--g50);border:1px solid var(--g100);border-radius:100px;padding:5px 12px\">Раствор для инъекций<\u002Fspan>\n    <span style=\"font-size:10.5px;color:var(--g700);background:var(--g50);border:1px solid var(--g100);border-radius:100px;padding:5px 12px\">Госпитальный канал<\u002Fspan>\n    <span style=\"font-size:10.5px;color:var(--g700);background:var(--g50);border:1px solid var(--g100);border-radius:100px;padding:5px 12px\">Перечень ЖНВЛП<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"stat-row\" style=\"margin-top:32px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px\">\n    <div style=\"background:var(--g900);border-radius:12px;padding:18px 20px;color:#fff\">\n      <div style=\"font-family:var(--font-head);font-weight:700;font-size:36px;letter-spacing:-1px;line-height:1\">5,90<\u002Fdiv>\n      <div style=\"font-size:10px;letter-spacing:0.3px;color:var(--dark-text-mid);margin-top:6px;text-transform:uppercase\">Итоговый балл <span style=\"color:var(--red)\">↓ −1,05<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--g900);border-radius:12px;padding:18px 20px;color:#fff\">\n      <div style=\"font-family:var(--font-head);font-weight:700;font-size:36px;letter-spacing:-1px;line-height:1\">№4<\u002Fdiv>\n      <div style=\"font-size:10px;letter-spacing:0.3px;color:var(--dark-text-mid);margin-top:6px;text-transform:uppercase\">Место в шорт-листе <span style=\"color:var(--red)\">↓ было №1<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--g900);border-radius:12px;padding:18px 20px;color:#fff\">\n      <div style=\"font-family:var(--font-head);font-weight:700;font-size:36px;letter-spacing:-1px;line-height:1\">6–10,5<span style=\"font-size:20px\">%<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:10px;letter-spacing:0.3px;color:var(--dark-text-mid);margin-top:6px;text-transform:uppercase\">Рост мир. рынка · CAGR<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:auto;padding-top:24px;border-top:1px solid var(--border)\">\n    <p style=\"font-size:10px;color:var(--text3);margin:0 0 7px;line-height:1.55\"><strong style=\"color:var(--text2)\">Основные источники:<\u002Fstrong> ГРЛС (grls.rosminzdrav.ru), ЕИС (zakupki.gov.ru), единый реестр ЕАЭС, FDA, отраслевые прогнозы мирового рынка (Spherical Insights, Verified Market Research, Market Statsville), РЛС, Vidal, Мирфарм.<\u002Fp>\n    <p style=\"font-size:10px;color:var(--text3);margin:0 0 7px;line-height:1.55\"><strong style=\"color:var(--text2)\">Связь с серией:<\u002Fstrong> документ верифицирует балл терлипрессина, присвоенный в Документе 1-А «Методология отбора портфеля» (6,95 — первое место в шорт-листе), и опирается на рыночную рамку Документа 1. По итогам верификации балл пересмотрен — см. раздел 12 и итоговое резюме.<\u002Fp>\n    <p style=\"font-size:9px;color:var(--text3);margin:0;font-style:italic;line-height:1.5\">Документ подготовлен исключительно в аналитических целях для внутреннего использования инвестиционным комитетом. Не является инвестиционной рекомендацией, офертой, юридической или медицинской консультацией. Клинические сведения приводятся исключительно по регуляторно утверждённым документам (инструкция/ОХЛП) без интерпретации эффективности. Дата подготовки: июль 2026 г.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= TOC ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Содержание<\u002Fdiv>\n  <h2 style=\"font-family:var(--font-head);font-weight:700;font-size:26px;letter-spacing:-0.8px;color:var(--g900);margin:6px 0 18px\">Структура документа<\u002Fh2>\n  <div style=\"columns:2;column-gap:34px\">\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">01<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Резюме и инвестиционный вывод<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">02<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Медицинский контекст: бремя болезни, руководства, популяция<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">03<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Мировой рынок: размер, рост, прогноз, регионы, производители<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">04<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Российский рынок: препараты, производители, импортозависимость<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">05<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Анализ государственных закупок<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">06<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Анализ ГРЛС<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">07<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Конкурентная среда<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">08<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Ценовой анализ<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">09<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Патентный анализ и freedom to operate<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">10<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Потенциал локализации<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">11<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Международные возможности<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">12<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Инвестиционная оценка: SWOT и пересмотр скоринга<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">▪<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Резюме для инвестиционного комитета<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);break-inside:avoid\"><span style=\"color:var(--g500);font-family:var(--font-head);font-weight:700;min-width:22px;font-size:12px\">В<\u002Fspan><span style=\"color:var(--text2);font-size:11.5px\">Приложение: перечень обязательных выгрузок<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH1 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 01<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Резюме и инвестиционный вывод<\u002Fh1>\n\n  <p><strong>Главный вывод документа:<\u002Fstrong> верификация понизила оценку терлипрессина с 6,95 до 5,90 балла и переместила его с первого места шорт-листа на четвёртое. Причина — обнаружение факта, отсутствовавшего в исходной модели: в России зарегистрирован препарат «Терлипрессин МИРФАРМ» российского производителя АО «Мирфарм». Это одновременно опровергает допущение о высокой импортозависимости молекулы (балл 9 → 4) и создаёт материальный риск применения механизма ограничения допуска «второй лишний» к импортному препарату I-LACH.<\u002Fp>\n\n  <div class=\"tbl\" style=\"margin:14px 0 0\">\n    <div class=\"cap\">Таблица 1. Допущения исходной модели против фактов верификации<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr>\n        <sc-raw-th class=\"th\" style=\"width:20%\">Параметр<\u002Fsc-raw-th>\n        <sc-raw-th class=\"th\" style=\"width:27%\">Допущение Документа 1-А<\u002Fsc-raw-th>\n        <sc-raw-th class=\"th\" style=\"width:31%\">Факт по итогам верификации<\u002Fsc-raw-th>\n        <sc-raw-th class=\"th\" style=\"width:22%\">Влияние на кейс<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Российские производители<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Отсутствуют (импортозависимость 9/10)<\u002Fsc-raw-td><sc-raw-td class=\"td\">АО «Мирфарм» — зарегистрирован «Терлипрессин МИРФАРМ»<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:600\">Критическое: риск «второй лишний»<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Уровень конкуренции<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Минимальный (9/10)<\u002Fsc-raw-td><sc-raw-td class=\"td\">2–3 держателя РУ; на тендерах — единичные заявки<\u002Fsc-raw-td><sc-raw-td class=\"td\">Умеренное понижение (9 → 6)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Статус ЖНВЛП<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Не оценивался<\u002Fsc-raw-td><sc-raw-td class=\"td\">Входит в перечень ЖНВЛП (АТХ H01BA04)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Ценовой потолок регулируется<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Мировой рынок<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">6/10 (порядковая оценка)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Оценки третьих сторон расходятся в 7 раз ($0,5–3,9 млрд)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Балл сохранён, надёжность низкая<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Объём госзакупок РФ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">5/10 (порядковая оценка)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Выгрузка ЕИС: ₽69–251 млн/год, CAGR +24% (2021–25)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Верифицирован; ниша мала и волатильна<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\" style=\"border-top:2px solid var(--g500)\"><sc-raw-td class=\"td\"><b>Итоговый балл<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>6,95 (место 1)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>5,90 (место 4)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:600\">Понижение приоритета<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Источники: ГРЛС / единый реестр ЕАЭС (ОХЛП «Терлипрессин МИРФАРМ»), mirpharm.ru; расчёт скоринга — раздел 12.<\u002Fp>\n  <\u002Fdiv>\n\n  <p style=\"margin-top:14px\"><strong>Инвестиционный вывод:<\u002Fstrong> включать в портфель — да, но с понижением приоритета и с обязательной проверкой регуляторного риска до подачи досье. Молекула сохраняет привлекательность (специалти-инъекция, госпитальный канал, устойчивый клинический спрос, статус ЖНВЛП, растущий мировой рынок), однако тезис «ниша без локального производителя» не подтвердился. Терлипрессин должен рассматриваться не как маржинальный драйвер портфеля, а как позиция второго эшелона с реальным риском вытеснения из тендеров при развитии локального производства.<\u002Fp>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--g500);background:var(--g50);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g600);margin-bottom:5px\">▸ Ключевой вывод раздела<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Результат верификации — не аргумент против проекта, а доказательство работоспособности методики: скоринг был пересмотрен под давлением факта, а не подогнан под желаемый вывод. Комитету следует ожидать аналогичной проверки по остальным четырём молекулам и заложить в решение вероятность дальнейших понижений.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH2 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 02<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Медицинский контекст<\u002Fh1>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:0 0 8px\">2.1 · Фармакологический профиль (по утверждённой инструкции)<\u002Fh3>\n  <p>Терлипрессин — синтетический аналог вазопрессина (гормона задней доли гипофиза), пролекарство лизин-вазопрессина. Согласно утверждённой инструкции, вызывает сокращение артериол, вен и венул висцеральных органов, что уменьшает кровоток через печень и снижает давление в портальной системе; стимулирует сокращение гладкой мускулатуры пищевода, повышает тонус и перистальтику кишечника, усиливает сократительную активность миометрия. В отличие от лизин-вазопрессина, характеризуется более длительным развитием и большей продолжительностью действия. Вводится внутривенно (болюс или кратковременная инфузия), а также парацервикально/интрацервикально.<\u002Fp>\n\n  <div class=\"tbl\" style=\"margin:12px 0 0\">\n    <div class=\"cap\">Таблица 2. Фармакологический профиль молекулы<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\" style=\"width:30%\"><b>МНН<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Терлипрессин (Terlipressin)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Код АТХ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">H01BA04 (гормоны задней доли гипофиза); EphMRA: B2G — системные гемостатики, H4D — антидиуретические гормоны<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Фармакотерапевтическая группа<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Гемостатическое / вазопрессорное средство<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Лекарственная форма<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Раствор для инъекций 0,1 мг/мл (ампулы 2 мл — 0,2 мг; 10 мл — 1,0 мг); лиофилизат для приготовления раствора (Глипрессин, 1 мг)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Перечень ЖНВЛП<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Да — предельная цена подлежит государственной регистрации<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Возрастные ограничения<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Взрослые от 18 лет; противопоказан детям и подросткам до 18 лет<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Канал реализации<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Госпитальный (рецептурный, стационарное применение)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Источники: инструкция по применению препарата «Терлипрессин» (ГАРАНТ, base.garant.ru/51551945); ОХЛП «Терлипрессин МИРФАРМ» (единый реестр ЕАЭС); РЛС (rlsnet.ru), Vidal (vidal.ru); перечень ЖНВЛП.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">2.2 · Утверждённые показания<\u002Fh3>\n  <p>Согласно инструкции, препарат показан взрослым при:<\u002Fp>\n  <ul>\n    <li>кровотечениях из ЖКТ и половых органов: при варикозном расширении вен пищевода, язвенной болезни желудка и двенадцатиперстной кишки;<\u002Fli>\n    <li>маточных кровотечениях (дисфункциональных, в родах и при прерывании беременности);<\u002Fli>\n    <li>гинекологических операциях на шейке матки (местное введение);<\u002Fli>\n    <li>кровотечениях во время хирургического вмешательства на органах брюшной полости и малого таза;<\u002Fli>\n    <li>гепаторенальном синдроме I типа (быстро прогрессирующей почечной недостаточности).<\u002Fli>\n  <\u002Ful>\n  <p><strong>Коммерчески значимый вывод:<\u002Fstrong> спрос на терлипрессин формируется не одной нозологией, а как минимум тремя независимыми клиническими контурами — гепатология/интенсивная терапия (ГРС, варикозные кровотечения), гастроэнтерология (ЖКТ-кровотечения) и акушерство-гинекология. Это расширяет базу заказчиков за пределы гепатологических центров и снижает зависимость от одного профиля стационаров.<\u002Fp>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">2.3 · Бремя заболевания и популяция пациентов<\u002Fh3>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 3. Бремя заболевания и доступность данных по популяции<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr>\n        <sc-raw-th class=\"th\" style=\"width:40%\">Показатель<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:30%\">Значение<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:30%\">Источник / статус данных<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Место болезней печени в мировой смертности<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Цирроз и болезни печени — в числе десяти ведущих причин смерти в мире<\u002Fsc-raw-td><sc-raw-td class=\"td\">ВОЗ (цит. по отраслевым обзорам рынка)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Смертность от болезней печени, США<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">&gt;44 тыс. смертей (2020 г.)<\u002Fsc-raw-td><sc-raw-td class=\"td\">CDC (цит. по Verified Market Reports)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Доля ГРС в структуре мирового рынка терлипрессина<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">≈48% выручки (2025 г.)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Spherical Insights<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Заболеваемость циррозом и ГРС в РФ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">н/д в открытых источниках<\u002Fsc-raw-td><sc-raw-td class=\"td\">Требуется: Росстат / ЦНИИОИЗ Минздрава, форма №12/№14<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Число пациентов с ГРС I типа в РФ в год<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">н/д<\u002Fsc-raw-td><sc-raw-td class=\"td\">Требуется: профильные регистры, клинические рекомендации Минздрава<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Ограничение: оценка российской популяции пациентов по открытым источникам невозможна. Для построения модели «пациенты → упаковки → выручка» требуется выгрузка статистики заболеваемости (ЦНИИОИЗ) и/или клинических рекомендаций по циррозу печени с указанием численности когорты. До этого объём спроса оценивается только по факту закупок (раздел 5).<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">2.4 · Место в клинических руководствах<\u002Fh3>\n  <p>Терлипрессин рассматривается как препарат выбора при гепаторенальном синдроме и включён в клинические практические рекомендации в Европе; вне США он является стандартом терапии ГРС. В США препарат был недоступен до сентября 2022 г., когда FDA одобрило Terlivaz (Mallinckrodt) для лечения взрослых, госпитализированных с гепаторенальным синдромом I типа (HRS-1); это стало первой доступной опцией терапии HRS-1 на американском рынке. Данный факт имеет двойное значение для оценки: он подтверждает клиническую состоятельность молекулы на самом требовательном регуляторном рынке и одновременно указывает, что глобальный жизненный цикл молекулы находится не в фазе заката, а в фазе географического расширения.<\u002Fp>\n  <p class=\"src\">Источники: FDA — одобрение Terlivaz (сентябрь 2022 г., по данным Emergen Research; отдельные обзоры указывают январь 2023 г. как дату публикации решения — расхождение требует сверки по базе FDA Drugs@FDA); Market Statsville; Emergen Research.<\u002Fp>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--g500);background:var(--g50);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g600);margin-bottom:5px\">▸ Ключевой вывод раздела<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Клиническая база молекулы устойчива: несколько независимых показаний, статус препарата выбора при ГРС, включение в европейские руководства и недавнее одобрение FDA. Однако количественная оценка российской популяции пациентов по открытым данным невозможна — до выгрузки статистики заболеваемости объём спроса измерим только через фактические закупки, а не через эпидемиологическую модель.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<!-- ================= CH3 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 03<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Мировой рынок<\u002Fh1>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:0 0 8px\">3.1 · Критическое расхождение оценок третьих сторон<\u002Fh3>\n  <p>Опубликованные оценки мирового рынка терлипрессина расходятся более чем в семь раз. Это не техническая погрешность, а следствие несопоставимых периметров подсчёта. Комитету не следует использовать ни одну из этих цифр как основание для модели выручки без раскрытия методики соответствующего провайдера.<\u002Fp>\n\n  <div class=\"tbl\" style=\"margin:12px 0 0\">\n    <div class=\"cap\">Таблица 4. Оценки размера мирового рынка терлипрессина по провайдерам<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr>\n        <sc-raw-th class=\"th\" style=\"width:22%\">Провайдер оценки<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:15%\">База<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:15%\">Прогноз<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:13%\">CAGR<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:35%\">Комментарий к расхождению<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Spherical Insights<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">$1,78 млрд (2025)<\u002Fsc-raw-td><sc-raw-td class=\"td\">$3,64 млрд (2035)<\u002Fsc-raw-td><sc-raw-td class=\"td\">7,42%<br>(2026–2035)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Наиболее свежая и детализированная оценка (сегментация по каналам и показаниям)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Verified Market Research<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">$3,9 млрд (2023)<\u002Fsc-raw-td><sc-raw-td class=\"td\">$5,1 млрд (2030)<\u002Fsc-raw-td><sc-raw-td class=\"td\">6,1%<br>(2024–2030)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Оценка вдвое выше при более ранней базе — вероятно, включает смежные вазопрессорные позиции<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Verified Market Reports<\u002Fb> (терлипрессин ацетат)<\u002Fsc-raw-td><sc-raw-td class=\"td\">$3,10 млрд (2023)<\u002Fsc-raw-td><sc-raw-td class=\"td\">$5,2 млрд (2030)<\u002Fsc-raw-td><sc-raw-td class=\"td\">6,2%<\u002Fsc-raw-td><sc-raw-td class=\"td\">Периметр — субстанция (ацетат), не готовая форма<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\" style=\"background:var(--g50)\"><sc-raw-td class=\"td\"><b>Verified Market Reports<\u002Fb> (инъекции)<\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>$500 млн (2024)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>$1,2 млрд (2033)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>10,5%<\u002Fb><br>(2026–2033)<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--g700)\"><b>Узкий периметр — только инъекционная готовая форма; наиболее вероятно ближе к реальности<\u002Fb><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Market Statsville<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">$2,5 млн (2022)<\u002Fsc-raw-td><sc-raw-td class=\"td\">$4,5 млн (2033)<\u002Fsc-raw-td><sc-raw-td class=\"td\">5,4%<\u002Fsc-raw-td><sc-raw-td class=\"td\">Порядок величин расходится в 1000 раз — вероятна опечатка в единицах измерения источника<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Источники: Spherical Insights (sphericalinsights.com/reports/terlipressin-market); Verified Market Research; Verified Market Reports; Market Statsville. Все перечисленные — коммерческие провайдеры второго эшелона; методики не раскрываются публично. Оценки IQVIA и Evaluate Pharma по данной молекуле в открытом доступе не обнаружены.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"fig\" style=\"margin:14px 0 0;border:1px solid var(--border);border-radius:10px;padding:14px 16px 10px;background:var(--white)\">\n    <div class=\"cap\" style=\"margin-bottom:2px\">Рисунок 1. Разброс оценок базового года — расхождение периметров подсчёта<\u002Fdiv>\n    <p style=\"font-size:9.5px;color:var(--text3);margin:0 0 8px\">Значения базового года каждой оценки, $ млрд. Зелёным — рекомендуемый периметр (инъекционная готовая форма). Оценка Market Statsville исключена как вероятная опечатка в единицах.<\u002Fp>\n    <svg sc-camel-view-box=\"0 0 690 190\" width=\"100%\" style=\"display:block\" font-family=\"Inter,sans-serif\">\n      <g stroke=\"var(--border)\" stroke-width=\"1\">\n        <line x1=\"250\" y1=\"14\" x2=\"250\" y2=\"168\"><\u002Fline><line x1=\"352\" y1=\"14\" x2=\"352\" y2=\"168\"><\u002Fline><line x1=\"454\" y1=\"14\" x2=\"454\" y2=\"168\"><\u002Fline><line x1=\"556\" y1=\"14\" x2=\"556\" y2=\"168\"><\u002Fline><line x1=\"658\" y1=\"14\" x2=\"658\" y2=\"168\"><\u002Fline>\n      <\u002Fg>\n      <g fill=\"var(--text3)\" font-size=\"9\" text-anchor=\"middle\">\n        <text x=\"250\" y=\"182\">$1,0<\u002Ftext><text x=\"352\" y=\"182\">$2,0<\u002Ftext><text x=\"454\" y=\"182\">$3,0<\u002Ftext><text x=\"556\" y=\"182\">$4,0<\u002Ftext><text x=\"658\" y=\"182\">$5,0<\u002Ftext>\n        <text x=\"148\" y=\"182\" fill=\"var(--text3)\">$ млрд (база)<\u002Ftext>\n      <\u002Fg>\n      <!-- bars: x0=148, scale 102px per $1bn -->\n      <g font-size=\"10.5\" fill=\"var(--text)\">\n        <text x=\"0\" y=\"30\">Verified Market Research<\u002Ftext>\n        <rect x=\"148\" y=\"20\" width=\"397.8\" height=\"15\" rx=\"2\" fill=\"var(--g300)\"><\u002Frect><text x=\"551\" y=\"31\" font-size=\"9.5\" fill=\"var(--text2)\">$3,9 · CAGR 6,1%<\u002Ftext>\n        <text x=\"0\" y=\"62\">VM Reports (ацетат)<\u002Ftext>\n        <rect x=\"148\" y=\"52\" width=\"316.2\" height=\"15\" rx=\"2\" fill=\"var(--g300)\"><\u002Frect><text x=\"470\" y=\"63\" font-size=\"9.5\" fill=\"var(--text2)\">$3,1 · CAGR 6,2%<\u002Ftext>\n        <text x=\"0\" y=\"94\">Spherical Insights<\u002Ftext>\n        <rect x=\"148\" y=\"84\" width=\"181.6\" height=\"15\" rx=\"2\" fill=\"var(--g400)\"><\u002Frect><text x=\"335\" y=\"95\" font-size=\"9.5\" fill=\"var(--text2)\">$1,78 · CAGR 7,4%<\u002Ftext>\n        <text x=\"0\" y=\"126\" font-weight=\"600\" fill=\"var(--g700)\">VM Reports (инъекции)<\u002Ftext>\n        <rect x=\"148\" y=\"116\" width=\"51\" height=\"15\" rx=\"2\" fill=\"var(--g500)\"><\u002Frect><text x=\"205\" y=\"127\" font-size=\"9.5\" font-weight=\"600\" fill=\"var(--g700)\">$0,5 · CAGR 10,5% ◄ рекомендуемый периметр<\u002Ftext>\n      <\u002Fg>\n      <text x=\"148\" y=\"158\" font-size=\"9\" fill=\"var(--red)\">↔ Разброс оценок базового года ≈ 7× при сходящемся темпе роста 6–10,5%<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <p style=\"margin-top:12px\"><strong>Аналитическая позиция.<\u002Fstrong> Для целей инвестиционного решения рекомендуется опираться на узкий периметр — рынок инъекционного терлипрессина ≈$0,5 млрд (2024) с прогнозным CAGR 7,5–10,5%. Он методологически ближе к тому, что фактически будет продавать I-LACH (готовая инъекционная форма), и даёт консервативную рамку. Оценки в $3–4 млрд следует считать завышенными до раскрытия методики. Существенно, что все источники, независимо от абсолютных значений, сходятся в направлении и порядке темпа роста: 6–10,5% годовых — это и есть единственный устойчивый вывод, который можно извлечь из данной группы источников.<\u002Fp>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">3.2 · Структура мирового рынка (Spherical Insights, 2025 г.)<\u002Fh3>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 5. Структура мирового рынка по ключевым разрезам<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:32%\">Разрез<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:28%\">Доля<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:40%\">Значение для I-LACH<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Гепаторенальный синдром<\u002Fb> (по показанию)<\u002Fsc-raw-td><sc-raw-td class=\"td\">≈48%<\u002Fsc-raw-td><sc-raw-td class=\"td\">Основной драйвер спроса; совпадает с профилем позиционирования портфеля<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Госпитальные аптеки<\u002Fb> (по каналу)<\u002Fsc-raw-td><sc-raw-td class=\"td\">≈67%<\u002Fsc-raw-td><sc-raw-td class=\"td\">Подтверждает госпитальный характер молекулы — соответствует тендерной модели I-LACH<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Северная Америка<\u002Fb> (по регионам)<\u002Fsc-raw-td><sc-raw-td class=\"td\">$167 млн (2024) → $462 млн (2035)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Недоступный для I-LACH рынок; иллюстрирует ценовую премию в развитых юрисдикциях<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Источники: Spherical Insights (структура 2025 г.); WiseGuy Reports (региональная сегментация инъекционного рынка). Прочие показания: варикозные кровотечения пищевода, септический шок, асцит.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">3.3 · Драйверы роста<\u002Fh3>\n  <ul>\n    <li><strong>Рост распространённости заболеваний печени<\u002Fstrong> (цирроз, гепатиты) — базовый драйвер спроса, отмечаемый всеми провайдерами оценок.<\u002Fli>\n    <li><strong>Географическое расширение:<\u002Fstrong> одобрение FDA (2022 г.) открыло рынок США, ранее недоступный; это создаёт новый коммерческий поток для класса агонистов вазопрессиновых рецепторов.<\u002Fli>\n    <li><strong>Технологическое развитие форм:<\u002Fstrong> готовые к применению (ready-to-use) формы, преднаполненные шприцы, повышение стабильности сокращают время подготовки и риск ошибок дозирования. Для I-LACH это индикатор направления дифференциации конкурентов; поставка классической ампулы будет конкурировать ценой, а не удобством.<\u002Fli>\n    <li><strong>Смещение в интенсивную терапию:<\u002Fstrong> препарат применяется в неотложных состояниях, где спрос слабо эластичен по цене и не откладывается — фактор устойчивости объёмов.<\u002Fli>\n  <\u002Ful>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">3.4 · Мировые производители<\u002Fh3>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 6. Ключевые мировые производители терлипрессина<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:26%\">Производитель<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:28%\">Юрисдикция<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:46%\">Позиция<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Ferring Pharmaceuticals<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Швейцария / Германия / Чехия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Оригинатор класса; бренды Реместип, Глипрессин; присутствует в РФ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Mallinckrodt<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">США / Ирландия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Держатель регистрации Terlivaz в США (HRS-1)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>EVER Pharma<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Австрия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Европейский генериковый производитель<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Hybio Pharmaceutical<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Китай<\u002Fsc-raw-td><sc-raw-td class=\"td\">Крупный производитель пептидов; вероятный источник субстанции<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Hubei JX Bio, Hainan Poly Pharm, Shanghai Soho-Yiming, Xi'an Langene, Chinese Peptide<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Китай<\u002Fsc-raw-td><sc-raw-td class=\"td\">Плотная группа китайских производителей — основной источник ценового давления в мире<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Sun Pharmaceutical Industries<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Индия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Крупный генериковый игрок<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>SGPharma, Wellona Pharma, Trumac Healthcare<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Индия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Производители второго эшелона<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>VEM İlaç<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Турция<\u002Fsc-raw-td><sc-raw-td class=\"td\">Партнёр I-LACH; предполагаемый источник готовой формы<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Источники: Verified Market Research (ключевые игроки рынка); Verified Market Reports (игроки рынка инъекционного терлипрессина); ILACH Market Intelligence (партнёрство с VEM).<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"margin-top:10px\"><strong>Структурное наблюдение:<\u002Fstrong> не менее пяти из перечисленных производителей — китайские, и не менее четырёх — индийские. Это означает, что молекула коммодитизирована на уровне субстанции, и барьер входа на глобальном уровне — не технология, а регистрация. Для I-LACH это работает в обе стороны: низкая себестоимость субстанции доступна и проекту, и любому будущему конкуренту, желающему выйти на российский рынок.<\u002Fp>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--blue);background:var(--blue-bg);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:5px\">▸ Ключевой вывод раздела<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Мировой рынок растёт темпом 6–10,5% и находится в фазе географического расширения, а не заката — это подтверждает жизнеспособность молекулы. Однако абсолютный размер рынка не поддаётся верификации по открытым источникам (расхождение в 7 раз), а состав производителей (9+ игроков из Китая и Индии) указывает на коммодитизацию субстанции. Балл «мировой рынок» сохранён на уровне 6/10, но с пометкой о низкой надёжности.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH4 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 04<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Российский рынок<\u002Fh1>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:0 0 8px\">4.1 · Ключевое расхождение с исходным допущением<\u002Fh3>\n  <p>Документ 1-А присвоил терлипрессину балл импортозависимости 9/10, исходя из допущения об отсутствии российских производителей. Это допущение опровергнуто: АО «Мирфарм» (российская фармацевтическая компания, производство субстанций и готовых лекарственных средств) зарегистрировало препарат «Терлипрессин МИРФАРМ» в лекарственных формах 0,2 мг и 1,0 мг (раствор для инъекций), при этом ОХЛП доступна в едином реестре зарегистрированных лекарственных средств ЕАЭС — то есть регистрация выполнена по актуальным союзным правилам, а не по национальной процедуре.<\u002Fp>\n\n  <div class=\"tbl\" style=\"margin:12px 0 0\">\n    <div class=\"cap\">Таблица 7. Зарегистрированные препараты терлипрессина, релевантные рынку РФ/ЕАЭС<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:20%\">Препарат<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:22%\">Держатель РУ / производитель<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:12%\">Страна<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:46%\">Статус и комментарий<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\" style=\"background:var(--red-bg)\"><sc-raw-td class=\"td\"><b>Терлипрессин МИРФАРМ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">АО «Мирфарм»<\u002Fsc-raw-td><sc-raw-td class=\"td\">Россия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Р-р для инъекций 0,2 мг (амп. 2 мл) и 1,0 мг (амп. 10 мл); ОХЛП в едином реестре ЕАЭС. <b style=\"color:var(--red)\">Локальный производитель полного цикла — источник риска «второй лишний»<\u002Fb><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Реместип®<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">ФЕРРИНГ-ЛЕЧИВА (Ferring-Léčiva)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Чехия<\u002Fsc-raw-td><sc-raw-td class=\"td\">РУ П N013886/01-2002, регистрация 11.08.2011. Один из источников указывает состояние РУ как «не действует» — требует сверки в ГРЛС<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Глипрессин<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Ferring GmbH<\u002Fsc-raw-td><sc-raw-td class=\"td\">Германия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Лиофилизат 1 мг; на российском рынке присутствие ограничено — требует проверки в ГРЛС<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Терлипрессин<\u002Fb> (без ТН)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Не идентифицирован<\u002Fsc-raw-td><sc-raw-td class=\"td\">—<\u002Fsc-raw-td><sc-raw-td class=\"td\">РЛС фиксирует форму «раствор для инъекций 1 мг» без описания в базе — требует сверки<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Терлипрессин-Фармак<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">ПАО «Фармак»<\u002Fsc-raw-td><sc-raw-td class=\"td\">Украина<\u002Fsc-raw-td><sc-raw-td class=\"td\">Зарегистрирован в Украине; на рынке РФ не обращается — включён для полноты картины по постсоветскому пространству<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Источники: mirpharm.ru; ОХЛП «Терлипрессин МИРФАРМ» (единый реестр ЕАЭС, файл lsgeotar.ru); grls.pharm-portal.ru (карточка РУ Реместип: П N013886/01-2002, держатель ФЕРРИНГ-ЛЕЧИВА, Чехия, регистрация 11.08.2011, ЖНВЛП — да); compendium.com.ua; rlsnet.ru. ВНИМАНИЕ: перечень собран по вторичным агрегаторам ГРЛС и требует подтверждения прямым запросом в grls.rosminzdrav.ru (см. Приложение В).<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">4.2 · Оценка импортозависимости<\u002Fh3>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 8. Оценка импортозависимости молекулы<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:34%\">Параметр<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:24%\">Оценка<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:42%\">Обоснование<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Наличие российского производителя ГЛФ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:600\">Да (АО «Мирфарм»)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Опровергает тезис об окне импортозамещения<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Наличие российского производства субстанции<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Вероятно, нет<\u002Fsc-raw-td><sc-raw-td class=\"td\">«Мирфарм» заявляет производство субстанций; конкретно по терлипрессину не подтверждено — требует проверки<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Происхождение субстанции на мировом рынке<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Преимущественно Китай<\u002Fsc-raw-td><sc-raw-td class=\"td\">5+ китайских производителей пептидов (раздел 3.4)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\" style=\"border-top:2px solid var(--g500)\"><sc-raw-td class=\"td\"><b>Итоговый балл импортозависимости<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:700\">4/10 (было 9/10)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Локальный производитель присутствует; окно замещения фактически закрыто или закрывается<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n\n  <p style=\"margin-top:12px\"><strong>Регуляторное следствие.<\u002Fstrong> Наличие зарегистрированного препарата российского производства активирует применимость механизмов ограничения допуска иностранных препаратов к госзакупкам («третий лишний», а при наличии производства полного цикла из отечественной субстанции — «второй лишний»). Практическое значение: если на аукцион подана заявка с препаратом российского производства, заявки с импортными препаратами могут отклоняться. Для I-LACH, планирующего импорт готовой формы из Турции, это означает, что доступ к части тендеров по терлипрессину может быть ограничен независимо от цены предложения. Точная применимость механизма зависит от глубины передела «Мирфарм» (упаковка / готовая форма / полный цикл из отечественной субстанции) и подлежит установлению до подачи досье.<\u002Fp>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--red);background:var(--red-bg);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);margin-bottom:5px\">▸ Ключевой вывод раздела — критическая находка<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Это ключевой негативный результат верификации. Тезис «ниша без российского производителя» не подтвердился, а сопутствующий регуляторный риск («второй/третий лишний») переводит терлипрессин из категории защищённых ниш в категорию позиций с ограниченным доступом к тендерам. Требуется юридическое заключение о применимости механизма ограничения допуска до принятия решения о финансировании досье.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH5 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 05<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Анализ государственных закупок<\u002Fh1>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:0 0 8px\">5.1 · Источник и статус данных<\u002Fh3>\n  <p>Агрегированного ряда по объёму госзакупок терлипрессина ни один из открытых источников (ЕИС в части публичной аналитики, Cursor, Headway Company, AlphaRM, DSM Group, Vademecum, Фармвестник) не публикует: молекула слишком мала по объёму, чтобы попадать в рэнкинги ТОП-МНН, которые формируют основу открытой отраслевой статистики. Первичные данные при этом полностью содержатся в реестре контрактов ЕИС, но не агрегируются по МНН — требуется парсинг спецификаций контрактов.<\u002Fp>\n  <p>Такой парсинг выполнен: ряд ниже (таблица 9) построен по прямой выгрузке из реестра контрактов ЕИС за 01.01.2021–09.07.2026 с фильтрацией по МНН «терлипрессин» и разбором спецификаций лотов. Поля «Контракты» и «Средняя цена за единицу» помечены «нет данных» — они не восстанавливаются из публичных карточек и требуют доступа к первичным записям ЕИС.<\u002Fp>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">5.2 · Динамика государственных закупок (выгрузка ЕИС)<\u002Fh3>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 9. Динамика госзакупок терлипрессина в РФ, 2021–2026 YTD<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\">Год<\u002Fsc-raw-th><sc-raw-th class=\"th\">Сумма, млн ₽<\u002Fsc-raw-th><sc-raw-th class=\"th\">Тендеры<\u002Fsc-raw-th><sc-raw-th class=\"th\">Контракты<\u002Fsc
