ar(--text3)\">нет данных<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--g600)\">+89,4%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>2025<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">162,9<\u002Fsc-raw-td><sc-raw-td class=\"td\">254<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">нет данных<\u002Fsc-raw-td><sc-raw-td class=\"td\">0,64<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">нет данных<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red)\">−35,0%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>2026 YTD<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">116,5<\u002Fsc-raw-td><sc-raw-td class=\"td\">175<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">нет данных<\u002Fsc-raw-td><sc-raw-td class=\"td\">0,67<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">нет данных<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--g600)\">+42,6%*<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\" style=\"border-top:2px solid var(--g500)\"><sc-raw-td class=\"td\"><b>CAGR 2021–2025<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>+24,0%<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>+15,4%<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">—<\u002Fsc-raw-td><sc-raw-td class=\"td\">—<\u002Fsc-raw-td><sc-raw-td class=\"td\">—<\u002Fsc-raw-td><sc-raw-td class=\"td\">—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">* 2026 — неполный год (01.01–09.07); рост посчитан к сопоставимому периоду 2025 г. (₽81,7 млн), а не к полному году. Источник: реестр контрактов ЕИС (zakupki.gov.ru), выгрузка с фильтрацией по МНН «терлипрессин» и разбором спецификаций лотов, период 01.01.2021–09.07.2026. Поля «Контракты» и «Ср. цена ед.» не восстанавливаются из публичных карточек — «нет данных».<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"fig\" style=\"margin:12px 0 0;border:1px solid var(--border);border-radius:10px;padding:14px 16px 10px;background:var(--white)\">\n    <div class=\"cap\" style=\"margin-bottom:2px\">Рисунок 1а. Динамика госзакупок: сумма контрактов и число тендеров<\u002Fdiv>\n    <p style=\"font-size:9.5px;color:var(--text3);margin:0 0 6px\">Столбцы — сумма закупок, млн ₽ (левая шкала); линия — число тендеров (правая шкала). 2026 — неполный год (штриховка).<\u002Fp>\n    <svg sc-camel-view-box=\"0 0 690 250\" width=\"100%\" style=\"display:block\" font-family=\"Inter,sans-serif\">\n      <defs><pattern id=\"ytd\" width=\"6\" height=\"6\" sc-camel-pattern-units=\"userSpaceOnUse\" sc-camel-pattern-transform=\"rotate(45)\"><rect width=\"6\" height=\"6\" fill=\"var(--g200)\"><\u002Frect><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"var(--g500)\" stroke-width=\"2\"><\u002Fline><\u002Fpattern><\u002Fdefs>\n      <g stroke=\"var(--border)\" stroke-width=\"1\"><line x1=\"60\" y1=\"61.5\" x2=\"660\" y2=\"61.5\"><\u002Fline><line x1=\"60\" y1=\"130.8\" x2=\"660\" y2=\"130.8\"><\u002Fline><line x1=\"60\" y1=\"200\" x2=\"660\" y2=\"200\"><\u002Fline><\u002Fg>\n      <g fill=\"var(--text3)\" font-size=\"8.5\" text-anchor=\"end\"><text x=\"52\" y=\"64\">200<\u002Ftext><text x=\"52\" y=\"133\">100<\u002Ftext><text x=\"52\" y=\"203\">0<\u002Ftext><\u002Fg>\n      <g fill=\"var(--g500)\">\n        <rect x=\"87\" y=\"152.3\" width=\"46\" height=\"47.7\" rx=\"2\"><\u002Frect><rect x=\"187\" y=\"127.9\" width=\"46\" height=\"72.1\" rx=\"2\"><\u002Frect><rect x=\"287\" y=\"108.4\" width=\"46\" height=\"91.6\" rx=\"2\"><\u002Frect><rect x=\"387\" y=\"26.4\" width=\"46\" height=\"173.6\" rx=\"2\"><\u002Frect><rect x=\"487\" y=\"87.2\" width=\"46\" height=\"112.8\" rx=\"2\"><\u002Frect><rect x=\"587\" y=\"119.4\" width=\"46\" height=\"80.6\" rx=\"2\" fill=\"url(#ytd)\" stroke=\"var(--g500)\" stroke-width=\"1\"><\u002Frect>\n      <\u002Fg>\n      <g fill=\"var(--g800)\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\"><text x=\"110\" y=\"147\">68,9<\u002Ftext><text x=\"210\" y=\"122\">104,2<\u002Ftext><text x=\"310\" y=\"103\">132,4<\u002Ftext><text x=\"410\" y=\"21\">250,8<\u002Ftext><text x=\"510\" y=\"82\">162,9<\u002Ftext><text x=\"610\" y=\"114\">116,5<\u002Ftext><\u002Fg>\n      <polyline points=\"110,123.9 210,98.3 310,82.3 410,20 510,64.7 610,106.8\" fill=\"none\" stroke=\"var(--g900)\" stroke-width=\"2\"><\u002Fpolyline>\n      <g fill=\"var(--g900)\"><circle cx=\"110\" cy=\"123.9\" r=\"3.5\"><\u002Fcircle><circle cx=\"210\" cy=\"98.3\" r=\"3.5\"><\u002Fcircle><circle cx=\"310\" cy=\"82.3\" r=\"3.5\"><\u002Fcircle><circle cx=\"410\" cy=\"20\" r=\"3.5\"><\u002Fcircle><circle cx=\"510\" cy=\"64.7\" r=\"3.5\"><\u002Fcircle><circle cx=\"610\" cy=\"106.8\" r=\"3.5\"><\u002Fcircle><\u002Fg>\n      <g fill=\"var(--g900)\" font-size=\"8.5\" text-anchor=\"middle\"><text x=\"110\" y=\"137\">143<\u002Ftext><text x=\"210\" y=\"111\">191<\u002Ftext><text x=\"310\" y=\"95\">221<\u002Ftext><text x=\"430\" y=\"17\">338<\u002Ftext><text x=\"510\" y=\"57\">254<\u002Ftext><text x=\"628\" y=\"104\">175<\u002Ftext><\u002Fg>\n      <g fill=\"var(--text)\" font-size=\"9.5\" text-anchor=\"middle\"><text x=\"110\" y=\"216\">2021<\u002Ftext><text x=\"210\" y=\"216\">2022<\u002Ftext><text x=\"310\" y=\"216\">2023<\u002Ftext><text x=\"410\" y=\"216\">2024<\u002Ftext><text x=\"510\" y=\"216\">2025<\u002Ftext><text x=\"610\" y=\"216\">2026 YTD<\u002Ftext><\u002Fg>\n      <g font-size=\"9\"><rect x=\"60\" y=\"233\" width=\"12\" height=\"9\" rx=\"2\" fill=\"var(--g500)\"><\u002Frect><text x=\"77\" y=\"241\" fill=\"var(--text2)\">Сумма закупок, млн ₽<\u002Ftext><line x1=\"230\" y1=\"238\" x2=\"250\" y2=\"238\" stroke=\"var(--g900)\" stroke-width=\"2\"><\u002Fline><circle cx=\"240\" cy=\"238\" r=\"3\" fill=\"var(--g900)\"><\u002Fcircle><text x=\"256\" y=\"241\" fill=\"var(--text2)\">Число тендеров<\u002Ftext><\u002Fg>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <p style=\"margin-top:12px\"><strong>Чтение ряда.<\u002Fstrong> Ниша госзакупок терлипрессина невелика в абсолютном выражении (₽69–251 млн в год) и волатильна: за 2021–2024 гг. объём вырос почти вчетверо (CAGR +24,0%) с пиком ₽250,8 млн и 338 тендерами в 2024 г., после чего в 2025 г. сократился на 35%. Темп 2026 г. (+42,6% к сопоставимому периоду) указывает на восстановление, но год неполный. Средний лот стабилен и мал (₽0,48–0,74 млн), что подтверждает раздробленность спроса по множеству учреждений и согласуется с наблюдаемой практикой комбинированных лотов (раздел 5.3).<\u002Fp>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">5.3 · Единичное верифицированное наблюдение из ЕИС<\u002Fh3>\n  <p>Помимо агрегированного ряда, в открытом доступе идентифицирована конкретная закупочная процедура, иллюстрирующая характер рынка на уровне отдельного лота:<\u002Fp>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 10. Верифицированная закупочная процедура (выгрузка ЕИС)<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\" style=\"width:32%\"><b>Номер закупки<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">0348100016926000226<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Заказчик<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">ФГБУ (федеральное государственное бюджетное учреждение), Московская область<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Объект закупки<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Поставка лекарственных препаратов (МНН: ГАДОБУТРОЛ, ЦЕФТАЗИДИМ+[АВИБАКТАМ], ТЕРЛИПРЕССИН)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Тип процедуры<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Электронный аукцион (44-ФЗ)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Результат<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Признан несостоявшимся: по окончании срока подачи заявок подана только одна заявка; заявка соответствует требованиям<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Дата протокола<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">30.06.2026<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Правовое основание<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">п. 1 ч. 1 ст. 52 Закона № 44-ФЗ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Источник: zakupki.kontur.ru/0348100016926000226 (агрегатор данных ЕИС). Стоимостные параметры лота в публичной карточке скрыты и требуют обращения к первичной записи ЕИС.<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"margin-top:10px\">Аналитическая ценность наблюдения — три вывода, каждый из которых имеет прямое значение для тендерной стратегии:<\u002Fp>\n  <ul>\n    <li><strong>Единственная заявка — подтверждение узости конкуренции.<\u002Fstrong> Аукцион с одним участником означает заключение контракта фактически по НМЦК: ценовая эрозия отсутствует. Это подтверждает (хотя и на единичном наблюдении) тезис о низкой конкуренции в нише, пусть и в ослабленной формулировке относительно исходного балла 9/10.<\u002Fli>\n    <li><strong>Терлипрессин закупается в составе комбинированных лотов.<\u002Fstrong> Молекула объединена в одном лоте с гадобутролом (контрастное средство) и цефтазидимом+авибактамом (антибиотик) — препаратами из совершенно разных терапевтических групп. Для участия в таком тендере поставщик обязан обеспечить все позиции лота. Моно-портфельный поставщик терлипрессина к такому лоту не допускается — существенное структурное препятствие и аргумент в пользу расширения портфеля либо партнёрства с дистрибьютором.<\u002Fli>\n    <li><strong>Спрос присутствует в 2026 г.<\u002Fstrong> Факт объявления закупки федеральным учреждением в июне 2026 г. подтверждает наличие текущего бюджетного спроса на молекулу.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--red);background:var(--red-bg);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);margin-bottom:5px\">▸ Ключевой вывод раздела — ниша верифицирована<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Выгрузка из ЕИС закрывает главный пробел доказательной базы: ниша реальна, но мала и волатильна — ₽69–251 млн в год при среднем лоте &lt;₽0,75 млн и просадке −35% в 2025 г. Это подтверждает порядковую оценку объёма (5/10), но не даёт основания повышать её. Дополнительно наблюдение по отдельному лоту вскрывает структурный барьер — практику комбинированных лотов, недоступных моно-портфельному поставщику. Прогноз выручки следует строить на консервативном уровне с тестом на волатильность спроса.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH6 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 06<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Анализ ГРЛС<\u002Fh1>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:0 0 8px\">6.1 · Реестр регистрационных удостоверений<\u002Fh3>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 11. Реестр РУ по МНН «терлипрессин» (по вторичным агрегаторам)<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:20%\">Препарат<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:16%\">Держатель РУ<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:12%\">Страна<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:28%\">Форма / дозировка<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:14%\">Номер РУ<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:10%\">Дата рег.<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Терлипрессин МИРФАРМ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">АО «Мирфарм»<\u002Fsc-raw-td><sc-raw-td class=\"td\">Россия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Р-р для инъекций 0,1 мг/мл: 0,2 мг (2 мл); 1,0 мг (10 мл)<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--blue)\">ЕАЭС — сверка<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--blue)\">сверка<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Реместип®<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">ФЕРРИНГ-ЛЕЧИВА<\u002Fsc-raw-td><sc-raw-td class=\"td\">Чехия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Р-р для в/в введения 0,1 мг/мл<\u002Fsc-raw-td><sc-raw-td class=\"td\">П N013886/01-2002<\u002Fsc-raw-td><sc-raw-td class=\"td\">11.08.2011<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Глипрессин<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Ferring GmbH<\u002Fsc-raw-td><sc-raw-td class=\"td\">Германия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Лиофилизат 1 мг + растворитель<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--blue)\">сверка<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--blue)\">сверка<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\"><b style=\"color:var(--red)\">КРИТИЧЕСКОЕ ОГРАНИЧЕНИЕ:<\u002Fb> таблица собрана по вторичным агрегаторам ГРЛС (grls.pharm-portal.ru, rlsnet.ru, compendium.com.ua, единый реестр ЕАЭС) и НЕ является выгрузкой из официального реестра grls.rosminzdrav.ru. Официальный портал ГРЛС не индексируется поисковыми системами в объёме, достаточном для построения полной картины. Поля «сверка» подлежат обязательному заполнению прямым запросом в ГРЛС по МНН «терлипрессин» (Приложение В).<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">6.2 · Статус РУ Реместип — требует немедленной проверки<\u002Fh3>\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px\">\n    <p style=\"margin:0\">Карточка РУ Реместип в агрегаторе ГРЛС содержит состояние «Не действует» при одновременном указании «Срок введения в гражданский оборот — бессрочно» и отсутствии заполненных полей «Окончание действия», «Переоформление», «Аннулирование». Эта комбинация противоречива и допускает два взаимоисключающих прочтения: <strong>(а)<\u002Fstrong> РУ отозвано или не переоформлено — тогда оригинатор ушёл с рынка, и конкурентная картина радикально благоприятнее для I-LACH; <strong>(б)<\u002Fstrong> техническая ошибка агрегатора либо статус «ИЗМ» (в процессе изменений) — тогда препарат в обращении. Разница между сценариями определяет, конкурирует ли I-LACH с Ferring и «Мирфарм» или только с «Мирфарм». Установление факта — вопрос одного запроса в ГРЛС и <strong style=\"color:var(--red)\">приоритет №1<\u002Fstrong> в списке верификации.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">6.3 · Оценка конкурентной плотности по данным реестра<\u002Fh3>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 12. Конкурентная плотность по реестру РУ<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:30%\">Показатель<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:22%\">Значение<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:48%\">Интерпретация<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Держателей РУ (идентифицировано)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">2–3<\u002Fsc-raw-td><sc-raw-td class=\"td\">Низкая плотность; для сравнения — у метотрексата число РУ измеряется десятками<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Российские производители<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">1 (Мирфарм)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Окно импортозамещения закрыто<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Иностранные производители с РУ в РФ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">1–2 (Ferring)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Статус требует проверки (раздел 6.2)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Страны происхождения<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Россия, Чехия, Германия<\u002Fsc-raw-td><sc-raw-td class=\"td\">Отсутствие азиатских производителей в реестре РФ — потенциальное окно для входа, но и индикатор непривлекательности рынка для них<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Лекарственные формы<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Р-р для инъекций; лиофилизат<\u002Fsc-raw-td><sc-raw-td class=\"td\">I-LACH планирует р-р для инъекций (форма VEM) — прямая конкуренция с Мирфарм<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\" style=\"border-top:2px solid var(--g500)\"><sc-raw-td class=\"td\"><b>Балл «число держателей РУ»<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--orange);font-weight:700\">7/10 (было 9/10)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Понижен: наличие локального производителя учтено<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <p style=\"margin-top:10px\"><strong>Существенное наблюдение:<\u002Fstrong> отсутствие китайских и индийских производителей в российском реестре при их массовом присутствии на мировом рынке (раздел 3.4) допускает две интерпретации. <em>Позитивная:<\u002Fem> рынок не освоен азиатскими генериками, окно входа открыто. <em>Негативная:<\u002Fem> азиатские производители, обладающие наименьшей себестоимостью в мире, не сочли российский рынок терлипрессина достаточно ёмким для инвестиции в регистрацию — что косвенно указывает на малый объём ниши. Вторая интерпретация согласуется с невозможностью обнаружить молекулу в отраслевой статистике (раздел 5.1) и должна рассматриваться как базовая до получения выгрузки из ЕИС.<\u002Fp>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--blue);background:var(--blue-bg);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:5px\">▸ Ключевой вывод раздела<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Конкурентная плотность в реестре действительно низкая (2–3 держателя РУ) — это подтверждает часть исходного тезиса. Но низкая плотность объясняется, вероятно, не барьерами входа, а малой ёмкостью ниши: производители с наименьшей в мире себестоимостью не пришли на рынок, хотя ничто им не мешало. Балл понижен с 9 до 7. Приоритет верификации №1 — статус РУ Реместип.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH7 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 07<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Конкурентная среда<\u002Fh1>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:0 0 8px\">7.1 · Карта конкурентов на российском рынке<\u002Fh3>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 13. Карта конкурентов на рынке РФ<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:20%\">Конкурент<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:20%\">Тип<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:30%\">Сильные стороны<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:30%\">Уязвимости<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>АО «Мирфарм»<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Российский производитель полного цикла<\u002Fsc-raw-td><sc-raw-td class=\"td\">Статус локального производителя → преференции «второй/третий лишний»; регистрация по правилам ЕАЭС; вертикальная интеграция (субстанции + ГЛФ)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Ограниченный масштаб производства; отсутствие бренда оригинатора<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Ferring<\u002Fb> (Реместип, Глипрессин)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Иностранный оригинатор<\u002Fsc-raw-td><sc-raw-td class=\"td\">Бренд оригинатора; лояльность клиницистов; европейские клинические руководства<\u002Fsc-raw-td><sc-raw-td class=\"td\">Статус РУ под вопросом; санкционный и логистический риск; ценовая уязвимость перед генериками<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\" style=\"background:var(--g50)\"><sc-raw-td class=\"td\"><b>I-LACH<\u002Fb> (планируемая позиция)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Иностранный MAH-оператор<\u002Fsc-raw-td><sc-raw-td class=\"td\">Себестоимость турецкого контрактного производства; отсутствие обременения историей поставок<\u002Fsc-raw-td><sc-raw-td class=\"td\">Импортный статус → риск отклонения заявок; нет РУ; нет тендерной истории<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Потенциальные входящие<\u002Fb> (Китай, Индия)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Иностранные генерики<\u002Fsc-raw-td><sc-raw-td class=\"td\">Наименьшая в мире себестоимость субстанции и ГЛФ<\u002Fsc-raw-td><sc-raw-td class=\"td\">Отсутствуют в реестре РФ — вероятно, ниша для них нерентабельна<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">7.2 · Кто доминирует в закупках<\u002Fh3>\n  <p>Определить доминирующего поставщика по открытым данным невозможно — рэнкинги поставщиков публикуются на уровне рынка в целом (Документ 1, разд. 10: «Фармстандарт», «Р-Фарм», «Ирвин», «Протек», «Ланцет»), но не в разрезе отдельных малых МНН. Поставщиком терлипрессина в тендерах, как правило, выступает не производитель, а дистрибьютор, комплектующий комбинированный лот (раздел 5.3). Конкуренция за конечного заказчика ведётся не между производителями терлипрессина напрямую, а между дистрибьюторами, в чьи лоты включена молекула.<\u002Fp>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 14. Четыре уровня конкуренции и следствия для I-LACH<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:26%\">Уровень конкуренции<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:37%\">Наблюдаемая картина<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:37%\">Следствие для I-LACH<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>За РУ (регистрация)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">2–3 держателя; вход открыт<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--g600)\">Барьер преодолим — вопрос сроков и стоимости досье<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>За тендер (аукцион)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Единичные заявки (наблюдение 30.06.2026)<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--g600)\">Цена удерживается у НМЦК — маржа защищена<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>За лот (комплектация)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Комбинированные лоты из разных АТС-групп<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red)\">Моно-поставщик не допускается — требуется партнёрство с дистрибьютором<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>За допуск (регуляторная)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Локальный производитель присутствует<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red)\">Риск отклонения импортной заявки — главный барьер<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <p style=\"margin-top:10px\"><strong>Переопределение конкурентного риска.<\u002Fstrong> Исходная модель оценивала конкуренцию по числу игроков и присвоила 9/10 (почти отсутствует). Верификация показывает, что для терлипрессина релевантен не ценовой, а регуляторно-структурный тип конкуренции: I-LACH может предложить лучшую цену и всё равно не получить контракт — либо из-за преференции локальному производителю, либо из-за невозможности укомплектовать лот. Балл конкуренции понижен с 9 до 6: ценовое давление действительно низкое, но барьеры доступа выше, чем предполагалось.<\u002Fp>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--blue);background:var(--blue-bg);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:5px\">▸ Ключевой вывод раздела<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Конкурентная среда терлипрессина парадоксальна: мало игроков и почти нет ценовой конкуренции, но при этом высокие структурные барьеры доступа для импортного оператора. Выигрыш в этой нише определяется не ценой, а решением двух задач: юридической (обход/учёт механизма ограничения допуска) и коммерческой (доступ к комбинированным лотам через дистрибьютора).<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH8 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 08<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Ценовой анализ<\u002Fh1>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:0 0 8px\">8.1 · Доступные ценовые ориентиры<\u002Fh3>\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 15. Доступные ценовые ориентиры и статус регулирования<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:34%\">Ориентир<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:24%\">Значение<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:42%\">Источник / оговорка<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Розничная цена, Москва (аптечная выборка)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">от 9 350,5 ₽<\u002Fsc-raw-td><sc-raw-td class=\"td\">Агрегатор аптечных цен (009.рф), 3 аптеки — нерепрезентативная выборка<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Розничная цена (справочник)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">от 9 800 ₽<\u002Fsc-raw-td><sc-raw-td class=\"td\">РЛС (rlsnet.ru), раздел аналогов<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Статус ценового регулирования<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">ЖНВЛП — предельная зарегистрированная цена<\u002Fsc-raw-td><sc-raw-td class=\"td\">Перечень ЖНВЛП; цена производителя подлежит госрегистрации<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Предельная зарегистрированная цена ЖНВЛП<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">н/д по открытым источникам<\u002Fsc-raw-td><sc-raw-td class=\"td\">Требуется: ГРЛС, раздел предельных отпускных цен ЖНВЛП<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Средневзвешенная цена контракта<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">не определена<\u002Fsc-raw-td><sc-raw-td class=\"td\">Требуется: выгрузка ЕИС (раздел 5.2)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Ограничение: розничные цены нерелевантны для госпитального препарата и приводятся исключительно как порядковый ориентир. Реальная экономика позиции определяется предельной зарегистрированной ценой ЖНВЛП и ценой контракта, ни одна из которых не установлена по открытым данным.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">8.2 · Ценовая динамика и волатильность<\u002Fh3>\n  <p>Построение рядов исторической цены, тренда и волатильности невозможно по открытым источникам. Требуется выгрузка цен за единицу из спецификаций контрактов ЕИС за 2021–2026 гг. (раздел 5.2). Качественно предсказуемы три фактора, которые должны быть заложены в модель:<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:4px\">\n    <div style=\"border:1px solid var(--border);border-radius:8px;padding:11px 13px;background:var(--white)\">\n      <div style=\"font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px\">Потолок фиксирован<\u002Fdiv>\n      <p style=\"font-size:10.5px;margin:0;line-height:1.5\">Статус ЖНВЛП: цена не может превышать предельную зарегистрированную; индексация отстаёт от себестоимости (Документ 1, разд. 12.2). Верхняя граница выручки задана регулятором, а не рынком.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--border);border-radius:8px;padding:11px 13px;background:var(--white)\">\n      <div style=\"font-size:10px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px\">Эрозия минимальна<\u002Fdiv>\n      <p style=\"font-size:10.5px;margin:0;line-height:1.5\">При единичных заявках (раздел 5.3) контракт заключается по НМЦК; средняя экономия на торгах по рынку — лишь 3,8% (Документ 1, разд. 12.2). В нише терлипрессина она, вероятно, ниже.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--red-border);border-radius:8px;padding:11px 13px;background:var(--red-bg)\">\n      <div style=\"font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px\">Риск асимметричен<\u002Fdiv>\n      <p style=\"font-size:10.5px;margin:0;line-height:1.5\">Появление второго-третьего поставщика способно обрушить цену быстрее, чем на массовом рынке: контракты заключаются вблизи НМЦК — падать есть куда. Модель чувствительна к входу одного конкурента.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--red);background:var(--red-bg);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);margin-bottom:5px\">▸ Ключевой вывод раздела<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Ценовой профиль благоприятен сегодня (цены у НМЦК из-за отсутствия конкуренции), но структурно хрупок: потолок задан регулятором, а вход одного активного конкурента в узкую нишу способен резко снизить цену. Модель выручки по терлипрессину должна тестироваться на сценарий «−30% к цене при появлении второго поставщика».<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH9 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 09<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Патентный анализ и freedom to operate<\u002Fh1>\n\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 16. Патентный статус и freedom to operate<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:26%\">Аспект<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:22%\">Оценка<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:52%\">Обоснование / статус<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Патентная защита молекулы<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--g600);font-weight:600\">Отсутствует<\u002Fsc-raw-td><sc-raw-td class=\"td\">Терлипрессин синтезирован в 1960-х гг.; вещество вне патентной защиты. Косвенное подтверждение — наличие генериков (Мирфарм, EVER Pharma, 9+ азиатских производителей)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Патенты на способ применения (США)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Вероятно, действуют<\u002Fsc-raw-td><sc-raw-td class=\"td\">Terlivaz (Mallinckrodt) одобрен FDA в 2022 г. с эксклюзивностью; релевантно только для рынка США — вне периметра I-LACH<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Патенты на состав / форму в РФ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">не проверены<\u002Fsc-raw-td><sc-raw-td class=\"td\">Требуется: поиск в реестре Роспатента и Евразийском патентном ведомстве<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Freedom to operate в РФ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--g600);font-weight:600\">Предварительно — да<\u002Fsc-raw-td><sc-raw-td class=\"td\">Наличие генерика российского производства (Мирфарм) де-факто подтверждает отсутствие блокирующих патентов в РФ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Генериковая конкуренция<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Присутствует<\u002Fsc-raw-td><sc-raw-td class=\"td\">Молекула коммодитизирована глобально<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Потенциальные барьеры<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Регуляторные, не патентные<\u002Fsc-raw-td><sc-raw-td class=\"td\">Основной барьер — не ИС, а механизм ограничения допуска и требования к досье<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Ограничение: полноценный FTO-анализ по РФ и ЕАЭС не выполнен и требует профильного патентного поиска (Роспатент, ЕАПВ, FDA Orange Book для сверки). Приведённая оценка носит предварительный характер и опирается на факт присутствия генериков в обращении.<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"margin-top:12px\"><strong>Существенно для инвестиционной логики:<\u002Fstrong> сильнейшее доказательство freedom to operate в РФ — сам факт присутствия на рынке российского генерика «Терлипрессин МИРФАРМ». То есть обстоятельство, ухудшающее коммерческую перспективу (наличие локального конкурента), одновременно устраняет патентный риск. Для терлипрессина патентный риск не является материальным; материальным является регуляторный.<\u002Fp>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--g500);background:var(--g50);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g600);margin-bottom:5px\">▸ Ключевой вывод раздела<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Патентных препятствий для входа нет — молекула вне защиты, генерики в обращении. Freedom to operate требует формального подтверждения патентным поиском, но предварительная оценка положительна. Патентный риск по данной позиции — низкий и не должен влиять на решение.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH10 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 10<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Потенциал локализации<\u002Fh1>\n\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 17. Оценка потенциала локализации производства<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:28%\">Фактор<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:24%\">Оценка<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:48%\">Комментарий<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Доступность субстанции (API)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--g600);font-weight:600\">Высокая<\u002Fsc-raw-td><sc-raw-td class=\"td\">5+ производителей пептидов в Китае (Hybio, Chinese Peptide, Hubei JX Bio и др.); субстанция коммодитизирована<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Сложность производства<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Средняя-высокая<\u002Fsc-raw-td><sc-raw-td class=\"td\">Синтетический пептид + стерильная инъекционная форма; требует асептического производства и контроля пептидных примесей<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Технологические требования<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Асептический розлив, контроль стабильности<\u002Fsc-raw-td><sc-raw-td class=\"td\">Для I-LACH несущественно на этапе 1 — производство несёт VEM (Турция)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Инвестиции в локализацию упаковки<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">не оценивалась<\u002Fsc-raw-td><sc-raw-td class=\"td\">Требуется КП от площадок-кандидатов; ориентир по отрасли не применим без спецификации<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Инвестиции в полный цикл<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">не оценивалась<\u002Fsc-raw-td><sc-raw-td class=\"td\">Вне периметра фазы 1–3 проекта<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Ориентировочный срок<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--text3)\">не оценивался<\u002Fsc-raw-td><sc-raw-td class=\"td\">Зависит от выбора площадки и глубины передела<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\" style=\"border-top:2px solid var(--g500)\"><sc-raw-td class=\"td\"><b>Балл потенциала локализации<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"font-weight:700\">5/10 (без изменений)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Технически возможно; экономически не обосновано при неизвестном объёме ниши<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Ограничение: количественная оценка CAPEX и сроков локализации не может быть выполнена без коммерческих предложений от конкретных производственных площадок и без подтверждённого объёма рынка. Любые цифры инвестиций, приведённые без этих входных данных, были бы фиктивными.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-top:12px\">\n    <div style=\"font-size:10px;font-weight:700;color:var(--g700);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px\">Стратегическая коллизия<\u002Fdiv>\n    <p style=\"margin:0\">Локализация терлипрессина — единственный способ нейтрализовать риск «второй лишний» (раздел 4.2) и уравняться в правах с «Мирфарм». Однако она же экономически не обоснована: инвестировать в локализацию имеет смысл только при подтверждённом объёме ниши, а объём не подтверждён и, судя по косвенным признакам (отсутствие молекулы в отраслевой статистике, неприход азиатских производителей), невелик. Это ставит терлипрессин в положение позиции, где единственное решение главного риска недоступно по экономическим причинам.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--blue);background:var(--blue-bg);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:5px\">▸ Ключевой вывод раздела<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Локализация технически реализуема (субстанция доступна, технология освоена в мире), но лишена экономического обоснования до подтверждения объёма ниши. Практический вывод: терлипрессин остаётся импортной позицией с неустранимым регуляторным риском — либо ниша подтверждается выгрузкой из ЕИС как достаточно ёмкая, либо молекула остаётся тактической позицией без инвестиции в локализацию.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH11 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 11<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Международные возможности<\u002Fh1>\n\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 18. Оценка международных возможностей по юрисдикциям<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:15%\">Рынок<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:30%\">Возможность<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:33%\">Ограничение<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:22%\">Приоритет<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Россия<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Госпитальный спрос подтверждён (закупка 06.2026); ЖНВЛП; 2–3 держателя РУ<\u002Fsc-raw-td><sc-raw-td class=\"td\">Локальный производитель → «второй лишний»; комбинированные лоты<\u002Fsc-raw-td><sc-raw-td class=\"td\">Базовый, но с оговорками<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Турция<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Производственная база VEM; препарат в портфеле производителя<\u002Fsc-raw-td><sc-raw-td class=\"td\">Не рынок сбыта для I-LACH на старте<\u002Fsc-raw-td><sc-raw-td class=\"td\">Производственный узел<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Казахстан<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Единые правила ЕАЭС → перенос досье; закупки через «СК-Фармация» одним контрактом<\u002Fsc-raw-td><sc-raw-td class=\"td\">Ёмкость ниши в РК кратно меньше РФ; статус локальных конкурентов не изучен<\u002Fsc-raw-td><sc-raw-td class=\"td\">Фаза 4<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Беларусь<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Перенос досье ЕАЭС; госпитальный канал структурирован<\u002Fsc-raw-td><sc-raw-td class=\"td\">Малая ёмкость; данных по закупкам терлипрессина в РБ нет<\u002Fsc-raw-td><sc-raw-td class=\"td\">Фаза 3–4<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Ближний Восток<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Признание турецких GMP-досье в ряде стран; высокая распространённость заболеваний печени<\u002Fsc-raw-td><sc-raw-td class=\"td\">Периметр не изучен; вне базового сценария<\u002Fsc-raw-td><sc-raw-td class=\"td\">Опцион<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <p style=\"margin-top:12px\"><strong>Ключевое преимущество для международного контура<\u002Fstrong> — регистрация «Терлипрессин МИРФАРМ» выполнена по правилам ЕАЭС и доступна в едином реестре Союза. Это подтверждает: молекула проходит союзную процедуру, следовательно, досье I-LACH также может быть подано по правилам ЕАЭС с последующим признанием в РБ и РК. Возврат на инвестицию в досье распределяется на три юрисдикции — единственный фактор, существенно улучшающий экономику позиции после понижения баллов.<\u002Fp>\n  <p class=\"src\">Источник: ОХЛП «Терлипрессин МИРФАРМ» — «доступна в едином реестре зарегистрированных лекарственных средств Евразийского экономического союза». Данные по объёмам закупок терлипрессина в РК и РБ в открытых источниках не обнаружены; требуется запрос в «СК-Фармация» (РК) и Минздрав РБ.<\u002Fp>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--g500);background:var(--g50);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g600);margin-bottom:5px\">▸ Ключевой вывод раздела<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Международный контур — сильнейший аргумент в пользу сохранения молекулы в портфеле: единое досье ЕАЭС амортизируется на три юрисдикции, что частично компенсирует ограниченность российской ниши. Балл экспортного потенциала сохранён на уровне 7/10.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CH12 ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Раздел 12<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Инвестиционная оценка: SWOT и пересмотр скоринга<\u002Fh1>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:0 0 8px\">12.1 · SWOT<\u002Fh3>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n    <div style=\"border:1px solid var(--g200);border-radius:8px;overflow:hidden\">\n      <div style=\"background:var(--g500);color:#fff;font-size:11px;font-weight:600;letter-spacing:0.5px;padding:6px 12px\">Сильные стороны — Strengths<\u002Fdiv>\n      <ul style=\"margin:9px 0;padding-left:24px\">\n        <li>Препарат выбора при ГРС; включён в европейские руководства<\u002Fli>\n        <li>Статус ЖНВЛП — обязательность закупки<\u002Fli>\n        <li>Низкая плотность держателей РУ (2–3)<\u002Fli>\n        <li>Единичные заявки на аукционах → цена у НМЦК<\u002Fli>\n        <li>Несколько независимых показаний (гепатология, ЖКТ, гинекология)<\u002Fli>\n        <li>Вне патентной защиты; FTO предварительно подтверждён<\u002Fli>\n        <li>Досье переносимо на РБ/РК по правилам ЕАЭС<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--red-border);border-radius:8px;overflow:hidden\">\n      <div style=\"background:var(--red);color:#fff;font-size:11px;font-weight:600;letter-spacing:0.5px;padding:6px 12px\">Слабые стороны — Weaknesses<\u002Fdiv>\n      <ul style=\"margin:9px 0;padding-left:24px\">\n        <li>Российский производитель присутствует (Мирфарм) → окно замещения закрыто<\u002Fli>\n        <li>Объём ниши не верифицирован; вероятно мал<\u002Fli>\n        <li>Молекула отсутствует в отраслевой статистике<\u002Fli>\n        <li>Закупается в комбинированных лотах — недоступно моно-поставщику<\u002Fli>\n        <li>Ценовой потолок задан регулятором (ЖНВЛП)<\u002Fli>\n        <li>Оценки мирового рынка расходятся в 7 раз<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--blue-border);border-radius:8px;overflow:hidden\">\n      <div style=\"background:var(--blue);color:#fff;font-size:11px;font-weight:600;letter-spacing:0.5px;padding:6px 12px\">Возможности — Opportunities<\u002Fdiv>\n      <ul style=\"margin:9px 0;padding-left:24px\">\n        <li>Мировой рынок растёт на 6–10,5% в год<\u002Fli>\n        <li>Фаза географического расширения (одобрение FDA 2022 г.)<\u002Fli>\n        <li>Азиатские производители отсутствуют в реестре РФ — ниша не занята<\u002Fli>\n        <li>Возможный уход Ferring (статус РУ Реместип под вопросом) — освобождение доли<\u002Fli>\n        <li>Единое досье ЕАЭС → три юрисдикции<\u002Fli>\n        <li>Тренд на ready-to-use формы — окно дифференциации<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--orange-border);border-radius:8px;overflow:hidden\">\n      <div style=\"background:var(--orange);color:#fff;font-size:11px;font-weight:600;letter-spacing:0.5px;padding:6px 12px\">Угрозы — Threats<\u002Fdiv>\n      <ul style=\"margin:9px 0;padding-left:24px\">\n        <li>Механизм «второй/третий лишний» → отклонение импортных заявок<\u002Fli>\n        <li>Расширение мощностей «Мирфарм» → вытеснение импорта<\u002Fli>\n        <li>Вход одного конкурента обрушивает цену от уровня НМЦК<\u002Fli>\n        <li>Отставание индексации предельных цен ЖНВЛП от себестоимости<\u002Fli>\n        <li>Валютный риск (лира в себестоимости)<\u002Fli>\n        <li>Санкционный/логистический риск поставки из Турции<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:18px 0 8px\">12.2 · Пересмотр скоринга по итогам верификации<\u002Fh3>\n\n  <div class=\"fig\" style=\"border:1px solid var(--border);border-radius:10px;padding:14px 16px 10px;background:var(--white)\">\n    <div class=\"cap\" style=\"margin-bottom:2px\">Рисунок 2. Пересмотр баллов по критериям: было (1-А) → стало<\u002Fdiv>\n    <p style=\"font-size:9.5px;color:var(--text3);margin:0 0 6px\">Красным — понижение балла, серым — без изменений. Шкала 0–10.<\u002Fp>\n    <svg sc-camel-view-box=\"0 0 682 356\" width=\"100%\" style=\"display:block\" font-family=\"Inter,sans-serif\">\n      <g stroke=\"var(--border)\" stroke-width=\"1\">\n        <line x1=\"250\" y1=\"20\" x2=\"250\" y2=\"300\"><\u002Fline><line x1=\"332\" y1=\"20\" x2=\"332\" y2=\"300\"><\u002Fline><line x1=\"414\" y1=\"20\" x2=\"414\" y2=\"300\"><\u002Fline><line x1=\"496\" y1=\"20\" x2=\"496\" y2=\"300\"><\u002Fline><line x1=\"578\" y1=\"20\" x2=\"578\" y2=\"300\"><\u002Fline><line x1=\"660\" y1=\"20\" x2=\"660\" y2=\"300\"><\u002Fline>\n      <\u002Fg>\n      <g fill=\"var(--text3)\" font-size=\"8.5\" text-anchor=\"middle\">\n        <text x=\"250\" y=\"314\">0<\u002Ftext><text x=\"332\" y=\"314\">2<\u002Ftext><text x=\"414\" y=\"314\">4<\u002Ftext><text x=\"496\" y=\"314\">6<\u002Ftext><text x=\"578\" y=\"314\">8<\u002Ftext><text x=\"660\" y=\"314\">10<\u002Ftext>\n      <\u002Fg>\n      <!-- x0=250, 41px per point; rows 26px from y=32 -->\n      <g font-size=\"10\" fill=\"var(--text)\">\n        <!-- Импортозависимость 9->4 -->\n        <text x=\"0\" y=\"35\">Импортозависимость (10%)<\u002Ftext>\n        <line x1=\"414\" y1=\"32\" x2=\"619\" y2=\"32\" stroke=\"var(--red)\" stroke-width=\"2\"><\u002Fline><circle cx=\"619\" cy=\"32\" r=\"4.5\" fill=\"var(--text3)\"><\u002Fcircle><text x=\"628\" y=\"35\" font-size=\"9\" fill=\"var(--text3)\">9<\u002Ftext><circle cx=\"414\" cy=\"32\" r=\"4.5\" fill=\"var(--red)\"><\u002Fcircle><text x=\"404\" y=\"35\" font-size=\"9\" font-weight=\"700\" fill=\"var(--red)\" text-anchor=\"end\">4<\u002Ftext>\n        <!-- Конкуренция 9->6 -->\n        <text x=\"0\" y=\"61\">Уровень конкуренции (10%)<\u002Ftext>\n        <line x1=\"496\" y1=\"58\" x2=\"619\" y2=\"58\" stroke=\"var(--red)\" stroke-width=\"2\"><\u002Fline><circle cx=\"619\" cy=\"58\" r=\"4.5\" fill=\"var(--text3)\"><\u002Fcircle><text x=\"628\" y=\"61\" font-size=\"9\" fill=\"var(--text3)\">9<\u002Ftext><circle cx=\"496\" cy=\"58\" r=\"4.5\" fill=\"var(--red)\"><\u002Fcircle><text x=\"486\" y=\"61\" font-size=\"9\" font-weight=\"700\" fill=\"var(--red)\" text-anchor=\"end\">6<\u002Ftext>\n        <!-- Держатели РУ 9->7 -->\n        <text x=\"0\" y=\"87\">Число держателей РУ (5%)<\u002Ftext>\n        <line x1=\"537\" y1=\"84\" x2=\"619\" y2=\"84\" stroke=\"var(--red)\" stroke-width=\"2\"><\u002Fline><circle cx=\"619\" cy=\"84\" r=\"4.5\" fill=\"var(--text3)\"><\u002Fcircle><text x=\"628\" y=\"87\" font-size=\"9\" fill=\"var(--text3)\">9<\u002Ftext><circle cx=\"537\" cy=\"84\" r=\"4.5\" fill=\"var(--red)\"><\u002Fcircle><text x=\"527\" y=\"87\" font-size=\"9\" font-weight=\"700\" fill=\"var(--red)\" text-anchor=\"end\">7<\u002Ftext>\n        <!-- Динамика CAGR 8->7 -->\n        <text x=\"0\" y=\"113\">Динамика закупок / CAGR (15%)<\u002Ftext>\n        <line x1=\"537\" y1=\"110\" x2=\"578\" y2=\"110\" stroke=\"var(--red)\" stroke-width=\"2\"><\u002Fline><circle cx=\"578\" cy=\"110\" r=\"4.5\" fill=\"var(--text3)\"><\u002Fcircle><text x=\"587\" y=\"113\" font-size=\"9\" fill=\"var(--text3)\">8<\u002Ftext><circle cx=\"537\" cy=\"110\" r=\"4.5\" fill=\"var(--red)\"><\u002Fcircle><text x=\"527\" y=\"113\" font-size=\"9\" font-weight=\"700\" fill=\"var(--red)\" text-anchor=\"end\">7<\u002Ftext>\n        <!-- Объем госзакупок 5->5 -->\n        <text x=\"0\" y=\"139\">Объём госзакупок РФ (20%)<\u002Ftext>\n        <circle cx=\"455\" cy=\"136\" r=\"4.5\" fill=\"var(--text3)\"><\u002Fcircle><text x=\"464\" y=\"139\" font-size=\"9\" fill=\"var(--text3)\">5 · без изм.<\u002Ftext>\n        <!-- Размер мир рынка 6->6 -->\n        <text x=\"0\" y=\"165\">Размер мирового рынка (15%)<\u002Ftext>\n        <circle cx=\"496\" cy=\"162\" r=\"4.5\" fill=\"var(--text3)\"><\u002Fcircle><text x=\"505\" y=\"165\" font-size=\"9\" fill=\"var(--text3)\">6 · без изм.<\u002Ftext>\n        <!-- Сложность произв 5->5 -->\n        <text x=\"0\" y=\"191\">Сложность производства (10%)<\u002Ftext>\n        <circle cx=\"455\" cy=\"188\" r=\"4.5\" fill=\"var(--text3)\"><\u002Fcircle><text x=\"464\" y=\"191\" font-size=\"9\" fill=\"var(--text3)\">5 · без изм.<\u002Ftext>\n        <!-- Экспортный потенциал 7->7 -->\n        <text x=\"0\" y=\"217\">Экспортный потенциал (5%)<\u002Ftext>\n        <circle cx=\"537\" cy=\"214\" r=\"4.5\" fill=\"var(--text3)\"><\u002Fcircle><text x=\"546\" y=\"217\" font-size=\"9\" fill=\"var(--text3)\">7 · без изм.<\u002Ftext>\n        <!-- Локализация 5->5 -->\n        <text x=\"0\" y=\"243\">Потенциал локализации (5%)<\u002Ftext>\n        <circle cx=\"455\" cy=\"240\" r=\"4.5\" fill=\"var(--text3)\"><\u002Fcircle><text x=\"464\" y=\"243\" font-size=\"9\" fill=\"var(--text3)\">5 · без изм.<\u002Ftext>\n        <!-- Стратег соответствие 10->10 -->\n        <text x=\"0\" y=\"269\">Стратег. соответствие (5%)<\u002Ftext>\n        <circle cx=\"660\" cy=\"266\" r=\"4.5\" fill=\"var(--g500)\"><\u002Fcircle><text x=\"650\" y=\"269\" font-size=\"9\" font-weight=\"700\" fill=\"var(--g600)\" text-anchor=\"end\">10<\u002Ftext>\n      <\u002Fg>\n      <line x1=\"250\" y1=\"286\" x2=\"660\" y2=\"286\" stroke=\"var(--border)\"><\u002Fline>\n      <g font-size=\"10.5\" font-weight=\"700\">\n        <text x=\"0\" y=\"343\" fill=\"var(--g900)\">ИТОГОВЫЙ ВЗВЕШЕННЫЙ БАЛЛ<\u002Ftext>\n        <text x=\"250\" y=\"343\" fill=\"var(--text3)\">6,95<\u002Ftext>\n        <text x=\"300\" y=\"343\" fill=\"var(--text3)\">→<\u002Ftext>\n        <text x=\"325\" y=\"343\" fill=\"var(--red)\">5,90<\u002Ftext>\n        <text x=\"385\" y=\"343\" fill=\"var(--red)\" font-weight=\"600\" font-size=\"9.5\">(−1,05 · место 1 → 4)<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <div class=\"tbl\" style=\"margin-top:12px\">\n    <div class=\"cap\">Таблица 19. Пересмотр скоринга по критериям с весами<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:28%\">Критерий<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:8%\">Вес<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:12%\">Было (1-А)<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:12%\">Стало<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:40%\">Основание пересмотра<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Объём госзакупок РФ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">20%<\u002Fsc-raw-td><sc-raw-td class=\"td\">5<\u002Fsc-raw-td><sc-raw-td class=\"td\">5<\u002Fsc-raw-td><sc-raw-td class=\"td\">Не верифицирован; балл сохранён как порядковый<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Динамика закупок (CAGR)<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">15%<\u002Fsc-raw-td><sc-raw-td class=\"td\">8<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:600\">7<\u002Fsc-raw-td><sc-raw-td class=\"td\">Мировой CAGR 6–10,5%; российская динамика не измерена<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Размер мирового рынка<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">15%<\u002Fsc-raw-td><sc-raw-td class=\"td\">6<\u002Fsc-raw-td><sc-raw-td class=\"td\">6<\u002Fsc-raw-td><sc-raw-td class=\"td\">Сохранён; надёжность низкая (расхождение в 7 раз)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Импортозависимость РФ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">10%<\u002Fsc-raw-td><sc-raw-td class=\"td\">9<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:700\">4<\u002Fsc-raw-td><sc-raw-td class=\"td\">Российский производитель присутствует (Мирфарм)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Уровень конкуренции<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">10%<\u002Fsc-raw-td><sc-raw-td class=\"td\">9<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:600\">6<\u002Fsc-raw-td><sc-raw-td class=\"td\">Ценовая конкуренция низкая, но барьеры доступа высоки<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Число держателей РУ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">5%<\u002Fsc-raw-td><sc-raw-td class=\"td\">9<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:600\">7<\u002Fsc-raw-td><sc-raw-td class=\"td\">2–3 держателя, включая локального<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Сложность производства<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">10%<\u002Fsc-raw-td><sc-raw-td class=\"td\">5<\u002Fsc-raw-td><sc-raw-td class=\"td\">5<\u002Fsc-raw-td><sc-raw-td class=\"td\">Без изменений — риск несёт VEM<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Экспортный потенциал<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">5%<\u002Fsc-raw-td><sc-raw-td class=\"td\">7<\u002Fsc-raw-td><sc-raw-td class=\"td\">7<\u002Fsc-raw-td><sc-raw-td class=\"td\">Подтверждён: досье ЕАЭС переносимо на РБ/РК<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Потенциал локализации<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">5%<\u002Fsc-raw-td><sc-raw-td class=\"td\">5<\u002Fsc-raw-td><sc-raw-td class=\"td\">5<\u002Fsc-raw-td><sc-raw-td class=\"td\">Технически возможен, экономически не обоснован<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Стратегическое соответствие<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">5%<\u002Fsc-raw-td><sc-raw-td class=\"td\">10<\u002Fsc-raw-td><sc-raw-td class=\"td\">10<\u002Fsc-raw-td><sc-raw-td class=\"td\">Без изменений: госпитальная инъекция, ядро модели<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\" style=\"border-top:2px solid var(--g500);background:var(--g50)\"><sc-raw-td class=\"td\"><b>ИТОГО<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>100%<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>6,95<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red)\"><b>5,90<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Понижение на 1,05 балла; место в шорт-листе: 1 → 4<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Расчёт: 5×0,20 + 7×0,15 + 6×0,15 + 4×0,10 + 6×0,10 + 7×0,05 + 5×0,10 + 7×0,05 + 5×0,05 + 10×0,05 = 1,00 + 1,05 + 0,90 + 0,40 + 0,60 + 0,35 + 0,50 + 0,35 + 0,25 + 0,50 = 5,90.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-top:12px\">\n    <div style=\"font-size:10px;font-weight:700;color:var(--g700);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px\">Влияние на портфель<\u002Fdiv>\n    <p style=\"margin:0\">Терлипрессин перемещается с первого места на четвёртое (после палоносетрона — 6,90, парикальцитола — 6,50 и метотрексата — 6,20), оставаясь выше эмедастина (5,35). Это меняет портфельную роль молекулы: она больше не может рассматриваться как «маржинальный драйвер с защитным рвом», как было заявлено в Документе 1-А. Корректная роль — тактическая позиция с опционом на международный контур. Соответственно, рекомендуется пересмотреть очерёдность подачи досье: приоритет должен быть отдан палоносетрону и парикальцитолу, по которым аналогичная верификация ещё не выявила блокирующих факторов.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= IC SUMMARY ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Резюме для инвестиционного комитета<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Терлипрессин — одна страница для решения<\u002Fh1>\n\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 20. Ключевые вопросы инвестиционного комитета<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:24%\">Вопрос<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:76%\">Ответ<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Почему эта молекула?<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Госпитальная специалти-инъекция, препарат выбора при гепаторенальном синдроме, входит в ЖНВЛП, вне патентной защиты, всего 2–3 держателя РУ, аукционы проходят с единичными заявками (цена у НМЦК). Досье переносимо на РБ/РК по правилам ЕАЭС.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Привлекателен ли рынок?<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>Частично.<\u002Fb> Мировой рынок растёт на 6–10,5% в год и находится в фазе географического расширения. Российская ниша <b style=\"color:var(--red)\">НЕ верифицирована<\u002Fb>: агрегированных данных по МНН нет ни в одном открытом источнике, молекула не попадает в отраслевые рэнкинги, азиатские производители не пришли на рынок. Косвенные признаки указывают на малую ёмкость.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Оправдана ли локализация?<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>Нет — на текущих данных.<\u002Fb> Технически реализуема (субстанция доступна у 5+ китайских производителей), но экономически не обоснована при неподтверждённом объёме ниши. При этом локализация — единственный способ нейтрализовать риск «второй лишний». Коллизия неразрешима до выгрузки из ЕИС.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Ключевые риски<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b>1)<\u002Fb> Механизм «второй/третий лишний»: наличие препарата «Терлипрессин МИРФАРМ» может блокировать допуск импортной заявки I-LACH независимо от цены. <b>2)<\u002Fb> Практика комбинированных лотов из разных АТС-групп — моно-поставщик не допускается. <b>3)<\u002Fb> Необъёмная ниша. <b>4)<\u002Fb> Обрушение цены от уровня НМЦК при входе одного конкурента.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\" style=\"background:var(--g50)\"><sc-raw-td class=\"td\"><b>Включать ли в портфель?<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\"><b style=\"color:var(--g700)\">Да, но с понижением приоритета<\u002Fb> — четвёртая позиция вместо первой. Подача досье допустима только после: <b>(а)<\u002Fb> выгрузки объёма закупок из ЕИС, <b>(б)<\u002Fb> юридического заключения о применимости «второго лишнего», <b>(в)<\u002Fb> сверки статуса РУ Реместип в ГРЛС. При объёме ниши ниже порога окупаемости досье — исключить.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--g700);margin:16px 0 8px\">Рейтинговая оценка (1–10)<\u002Fh3>\n  <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start\">\n    <div class=\"tbl\">\n      <sc-raw-table>\n        <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:52%\">Параметр<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:12%\">Оценка<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:36%\">Обоснование<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Привлекательность рынка<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"font-weight:700\">5<\u002Fsc-raw-td><sc-raw-td class=\"td\">Растущий мир. рынок при неверифицированной, вероятно малой нише РФ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Стабильность закупок<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"font-weight:700\">6<\u002Fsc-raw-td><sc-raw-td class=\"td\">Спрос неотложный и неэластичный; объём не измерен<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Конкуренция<\u002Fb> (10 = мин.)<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"font-weight:700\">6<\u002Fsc-raw-td><sc-raw-td class=\"td\">Мало игроков, нет эрозии, но барьеры доступа высоки<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Потенциал локализации<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"font-weight:700\">5<\u002Fsc-raw-td><sc-raw-td class=\"td\">Технически да, экономически нет<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Экспортный потенциал<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"font-weight:700\">7<\u002Fsc-raw-td><sc-raw-td class=\"td\">Досье ЕАЭС переносимо на РБ/РК<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>Стратегическое соответствие<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"font-weight:700\">10<\u002Fsc-raw-td><sc-raw-td class=\"td\">Госпитальная инъекция — ядро модели I-LACH<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr class=\"zeb\" style=\"border-top:2px solid var(--g500);background:var(--g50)\"><sc-raw-td class=\"td\"><b>ИТОГОВЫЙ ВЗВЕШ. БАЛЛ<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:700\">5,90<\u002Fsc-raw-td><sc-raw-td class=\"td\">Понижен с 6,95; место 1 → 4<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <div class=\"fig\" style=\"border:1px solid var(--border);border-radius:10px;padding:12px 14px 8px;background:var(--white)\">\n      <div class=\"cap\" style=\"margin-bottom:6px\">Рисунок 3. Профиль рейтинговой оценки<\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 300 240\" width=\"100%\" style=\"display:block\" font-family=\"Inter,sans-serif\">\n        <g stroke=\"var(--border)\" stroke-width=\"1\"><line x1=\"0\" y1=\"12\" x2=\"0\" y2=\"196\"><\u002Fline><\u002Fg>\n        <!-- x0=0? use plot from x=8 to 288 for 0-10; scale 28px/pt; rows 30px -->\n        <g font-size=\"9\" fill=\"var(--text)\">\n          <text x=\"0\" y=\"20\">Привлекательность рынка<\u002Ftext><rect x=\"0\" y=\"24\" width=\"140\" height=\"12\" rx=\"2\" fill=\"var(--g300)\"><\u002Frect><text x=\"146\" y=\"34\" font-size=\"9\" font-weight=\"700\" fill=\"var(--g700)\">5<\u002Ftext>\n          <text x=\"0\" y=\"52\">Стабильность закупок<\u002Ftext><rect x=\"0\" y=\"56\" width=\"168\" height=\"12\" rx=\"2\" fill=\"var(--g400)\"><\u002Frect><text x=\"174\" y=\"66\" font-size=\"9\" font-weight=\"700\" fill=\"var(--g700)\">6<\u002Ftext>\n          <text x=\"0\" y=\"84\">Конкуренция<\u002Ftext><rect x=\"0\" y=\"88\" width=\"168\" height=\"12\" rx=\"2\" fill=\"var(--g400)\"><\u002Frect><text x=\"174\" y=\"98\" font-size=\"9\" font-weight=\"700\" fill=\"var(--g700)\">6<\u002Ftext>\n          <text x=\"0\" y=\"116\">Потенциал локализации<\u002Ftext><rect x=\"0\" y=\"120\" width=\"140\" height=\"12\" rx=\"2\" fill=\"var(--g300)\"><\u002Frect><text x=\"146\" y=\"130\" font-size=\"9\" font-weight=\"700\" fill=\"var(--g700)\">5<\u002Ftext>\n          <text x=\"0\" y=\"148\">Экспортный потенциал<\u002Ftext><rect x=\"0\" y=\"152\" width=\"196\" height=\"12\" rx=\"2\" fill=\"var(--g500)\"><\u002Frect><text x=\"202\" y=\"162\" font-size=\"9\" font-weight=\"700\" fill=\"var(--g700)\">7<\u002Ftext>\n          <text x=\"0\" y=\"180\">Стратег. соответствие<\u002Ftext><rect x=\"0\" y=\"184\" width=\"280\" height=\"12\" rx=\"2\" fill=\"var(--g600)\"><\u002Frect><text x=\"255\" y=\"193\" font-size=\"9\" font-weight=\"700\" fill=\"#fff\">10<\u002Ftext>\n        <\u002Fg>\n        <g stroke=\"var(--border)\" stroke-dasharray=\"2 2\"><line x1=\"140\" y1=\"206\" x2=\"140\" y2=\"212\"><\u002Fline><\u002Fg>\n        <g font-size=\"8\" fill=\"var(--text3)\" text-anchor=\"middle\"><text x=\"0\" y=\"220\">0<\u002Ftext><text x=\"140\" y=\"220\">5<\u002Ftext><text x=\"280\" y=\"220\">10<\u002Ftext><\u002Fg>\n        <text x=\"0\" y=\"236\" font-size=\"9.5\" font-weight=\"700\" fill=\"var(--red)\">Взвешенный балл: 5,90 / 10<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout\" style=\"border-left:4px solid var(--g500);background:var(--g50);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 0\">\n    <div style=\"font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g600);margin-bottom:5px\">▸ Рекомендация — условное включение<\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--text);line-height:1.55;margin:0\">Терлипрессин сохраняет место в портфеле как тактическая позиция с международным опционом, но утрачивает статус приоритетной молекулы. Три отлагательных условия до финансирования досье: выгрузка объёма ниши из ЕИС, юридическое заключение по механизму ограничения допуска, сверка статуса РУ Реместип. Приоритет подачи досье рекомендуется передать палоносетрону и парикальцитолу.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= APPENDIX ================= -->\n<div class=\"ch\">\n  <div style=\"font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g500);font-weight:600\">Приложение В<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-head);font-weight:700;font-size:25px;letter-spacing:-0.7px;color:var(--g900);margin:5px 0 14px;padding-top:10px;border-top:3px solid var(--g500)\">Перечень обязательных выгрузок для верификации<\u002Fh1>\n\n  <div class=\"tbl\">\n    <div class=\"cap\">Таблица 21. План верификации: источники и приоритеты<\u002Fdiv>\n    <sc-raw-table>\n      <sc-raw-thead><sc-raw-tr><sc-raw-th class=\"th\" style=\"width:5%\">№<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:36%\">Что установить<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:37%\">Источник<\u002Fsc-raw-th><sc-raw-th class=\"th\" style=\"width:22%\">Приоритет / срок<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>1<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Статус РУ Реместип (действует / не действует / в процессе изменений)<\u002Fsc-raw-td><sc-raw-td class=\"td\">grls.rosminzdrav.ru — поиск по МНН «терлипрессин»<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:600\">Критический — 1 день<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>2<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Полный перечень РУ по МНН: держатели, производители, формы, даты, глубина передела «Мирфарм»<\u002Fsc-raw-td><sc-raw-td class=\"td\">grls.rosminzdrav.ru; единый реестр ЕАЭС<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:600\">Критический — 2 дня<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>3<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Применимость механизмов «второй/третий лишний» к терлипрессину<\u002Fsc-raw-td><sc-raw-td class=\"td\">Юридическое заключение; ПП РФ о доп. требованиях к закупкам ЛП<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:600\">Критический — 5–10 дней<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>4<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Объём госзакупок 2021–2026 YTD: суммы, тендеры, контракты, цены, регионы, заказчики, поставщики<\u002Fsc-raw-td><sc-raw-td class=\"td\">Реестр контрактов ЕИС (парсинг) либо запрос в Cursor / Headway / AlphaRM<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--red);font-weight:600\">Критический — 3–5 дней<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>5<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Предельная зарегистрированная цена ЖНВЛП по каждому ТН<\u002Fsc-raw-td><sc-raw-td class=\"td\">ГРЛС, раздел предельных отпускных цен<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--orange);font-weight:600\">Высокий — 1 день<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>6<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Доля терлипрессина в комбинированных лотах (частота практики)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Анализ структуры лотов в ЕИС<\u002Fsc-raw-td><sc-raw-td class=\"td\" style=\"color:var(--orange);font-weight:600\">Высокий — 2 дня<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>7<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Эпидемиология: число пациентов с ГРС и циррозом в РФ<\u002Fsc-raw-td><sc-raw-td class=\"td\">ЦНИИОИЗ Минздрава; клинические рекомендации<\u002Fsc-raw-td><sc-raw-td class=\"td\">Средний — 5 дней<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>8<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">FTO: патентный поиск по РФ/ЕАЭС<\u002Fsc-raw-td><sc-raw-td class=\"td\">Роспатент, ЕАПВ, FDA Orange Book<\u002Fsc-raw-td><sc-raw-td class=\"td\">Средний — 5–10 дней<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>9<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Объёмы закупок терлипрессина в РК и РБ<\u002Fsc-raw-td><sc-raw-td class=\"td\">«СК-Фармация» (РК); Минздрав РБ<\u002Fsc-raw-td><sc-raw-td class=\"td\">Средний — по запросу<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr class=\"zeb\"><sc-raw-td class=\"td\"><b>10<\u002Fb><\u002Fsc-raw-td><sc-raw-td class=\"td\">Сверка даты одобрения Terlivaz (сентябрь 2022 vs январь 2023)<\u002Fsc-raw-td><sc-raw-td class=\"td\">Drugs@FDA<\u002Fsc-raw-td><sc-raw-td class=\"td\">Низкий — 1 час<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <p class=\"src\">Совокупная оценка трудоёмкости: 3–4 недели работы одного аналитика при наличии доступа к ЕИС и ГРЛС, либо 1–2 недели при подписке на коммерческую ИАС. Позиции 1–4 являются блокирующими: без них решение по молекуле принимать нельзя.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:20px;padding-top:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px\">\n    <span style=\"display:inline-flex;width:22px;height:22px;background:var(--g500);border-radius:5px;color:#fff;font-family:var(--font-head);font-weight:700;align-items:center;justify-content:center;font-size:13px\">İ<\u002Fspan>\n    <span style=\"font-size:9.5px;color:var(--text3);line-height:1.5\">Конец Документа 3.1 · Серия аналитических отчётов по проекту I-LACH · Конфиденциально — для инвестиционного комитета · июль 2026 г.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
